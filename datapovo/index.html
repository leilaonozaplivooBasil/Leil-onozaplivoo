<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1F3A">
<meta name="referrer" content="no-referrer">
<title>DataPovo — Urna de pesquisa</title>
<style>
:root{--navy:#0B1F3A;--yellow:#F5B800;--green:#1B9E5A;--orange:#F28C28;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--navy);color:#fff;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{font-weight:800;font-size:24px}.brand b{color:var(--yellow)}
.top a{color:#BFD0E8;font-size:14px}
#teste{background:var(--yellow);color:#2B2100;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:12px}
#teste[hidden]{display:none}

.device{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,1fr);gap:16px;padding:16px;border-radius:18px;
  background:linear-gradient(#E6E9ED,#CDD2D8);box-shadow:0 10px 30px #0006}
@media (max-width:780px){.device{grid-template-columns:1fr}}

.screen{position:relative;background:#fff;color:#111;border:4px solid #A9AFB6;border-radius:6px;padding:16px 18px;
  min-height:420px;display:flex;flex-direction:column;gap:8px}
.s-title{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#5A6470}
.s-question{font-size:clamp(20px,3.4vw,28px);font-weight:800;line-height:1.2}
.s-label{font-size:12px;font-weight:700;letter-spacing:.12em;color:#5A6470;margin-top:2px}
.s-digits{display:flex;gap:8px}
.dig{width:50px;height:62px;border:2px solid #222;border-radius:4px;display:grid;place-items:center;font:700 34px var(--mono)}
.dig.cur{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:#E8EBEF}}
@media (prefers-reduced-motion:reduce){.dig.cur{animation:none}}
.s-info{min-height:70px}
.msg{font-size:clamp(22px,4vw,30px);font-weight:800}
.msg.warn{color:#9A2323}
.hint{font-size:14px;color:#4B5560;margin-top:4px}
.hint.bad{color:#9A2323;font-weight:600}
.pick{display:flex;gap:12px;align-items:center}
.pick .sw{width:12px;align-self:stretch;border-radius:3px}
.pick .nm{font-size:clamp(22px,4vw,30px);font-weight:800;line-height:1.1}
.s-options{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow:auto;border-top:1px solid #D5DAE0;padding-top:10px}
.opt{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;border-left:6px solid var(--c);background:#F3F5F8}
.opt .num{font:700 18px var(--mono);min-width:2ch}.opt .nm{font-weight:600}
.opt.dim{opacity:.35}.opt.match{background:#fff;outline:2px solid #222}
.s-foot{font-size:12px;color:#4B5560;border-top:1px solid #D5DAE0;padding-top:8px;line-height:1.5}
.s-foot .g{color:#0E6B3B;font-weight:700}.s-foot .o{color:#B25E0C;font-weight:700}

.over{position:absolute;inset:0;background:#fff;border-radius:4px;padding:18px;overflow:auto;display:flex;flex-direction:column;justify-content:center;gap:10px;color:#111}
.over[hidden]{display:none}
.over h2{margin:0;font-size:24px}
.over p{margin:0;color:#3C4651;font-size:15px;line-height:1.4}
.over input[type=text],.over input[type=tel]{width:100%;border:1px solid #B8C0C9;border-radius:8px;padding:11px;font-size:16px;color:#111;background:#fff}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4;color:#3C4651}
.ck input{width:22px;height:22px;flex:none;margin-top:1px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn{border:0;border-radius:8px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none;font-size:15px}
.btn.alt{background:#EEF1F5;color:#16202B;border:1px solid #CBD2DA}
.err{background:#FBE6E6;color:#7A1F1F;border-radius:8px;padding:9px 11px;font-size:14px}
.err[hidden]{display:none}

.keypad{background:#16181B;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:14px;align-self:start}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key,.act{border:0;border-radius:6px;cursor:pointer;touch-action:manipulation;user-select:none;font-weight:800;box-shadow:0 3px 0 #000}
.key{height:66px;background:#2B2E33;color:#fff;font-size:28px}
.key.zero{grid-column:2}
.key:active,.act:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.actions{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:10px}
.act{height:58px;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.act.branco{background:#F5F5F5;color:#111}.act.corrige{background:var(--orange);color:#1A0E00}.act.confirma{background:var(--green);color:#fff;font-size:14px}
.key:disabled,.act:disabled{opacity:.4;cursor:not-allowed}

.legal{text-align:center;font-size:12px;color:#8FA4C4;margin:12px 0 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;
  padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Data<b>Povo</b></div>
    <a href="resultado.html">Ver placar</a>
  </div>
  <div id="teste" hidden>MODO TESTE: os votos ficam só neste aparelho. Para juntar os votos de todo mundo, configure o servidor (veja o README).</div>

  <main class="device">
    <section class="screen" aria-live="polite">
      <div class="s-title" id="sTitle"></div>
      <div class="s-question" id="sQuestion"></div>
      <div class="s-label">NÚMERO</div>
      <div class="s-digits" id="sDigits"></div>
      <div class="s-info" id="sInfo"></div>
      <div class="s-options" id="sOptions"></div>
      <div class="s-foot">
        Tecla <span class="g">VERDE</span> para CONFIRMAR · <span class="o">LARANJA</span> para CORRIGIR · <b>BRANCO</b> para voto em branco
      </div>
      <div class="over" id="over" hidden></div>
    </section>

    <section class="keypad" aria-label="Teclado da urna">
      <div class="keys" id="keys"></div>
      <div class="actions">
        <button class="act branco" type="button" data-k="B">Branco</button>
        <button class="act corrige" type="button" data-k="C">Corrige</button>
        <button class="act confirma" type="button" data-k="OK">Confirma</button>
      </div>
    </section>
  </main>

  <p class="legal">Pesquisa de opinião — não é votação oficial e não tem valor eleitoral.</p>
</div>
<div id="toast" role="status"></div>

<script src="config.js"></script>
<script src="dados.js"></script>
<script>
(() => {
'use strict';
const C = window.DATAPOVO, DP = window.DP, h = DP.h;
const $ = s => document.querySelector(s);
const COLORS = ['#2F6FDE','#E0A100','#1B9E5A','#D9455F','#7B4FD1','#13A5B8','#E26A2C','#6B7A8C'];
const OPS = C.OPCOES, LEN = OPS[0].n.length;
if (OPS.some(o => o.n.length !== LEN || !/^\d+$/.test(o.n))) console.error('config.js: todos os números devem ter os mesmos dígitos.');

// ?evento = urna num tablet para várias pessoas votarem em sequência (sem travar por aparelho).
const EVENTO = new URLSearchParams(location.search).has('evento');
const FLAG = 'datapovo:votou';
const jaVotou = () => { if (EVENTO) return false; try { return localStorage.getItem(FLAG) === C.PERGUNTA; } catch (e) { return false; } };
const marcarVotou = () => { try { localStorage.setItem(FLAG, C.PERGUNTA); } catch (e) { /* sem armazenamento */ } };

// Ordem sorteada a cada abertura da página, para a lista não favorecer ninguém.
const ORDEM = OPS.map((o, i) => ({ ...o, cor: COLORS[i % COLORS.length] }));
for (let i = ORDEM.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ORDEM[i], ORDEM[j]] = [ORDEM[j], ORDEM[i]]; }
const achar = n => ORDEM.find(o => o.n === n);

let entry = '', mode = 'digitando', erro = '';   // digitando | branco | enviando | fim

/* ---- som ---- */
let actx;
function beep(tipo) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const [f, ms] = { key: [880, 60], err: [220, 220], end: [660, 900] }[tipo];
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'square'; o.frequency.value = f; g.gain.value = 0.08;
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + ms / 1000);
  } catch (e) { /* sem áudio */ }
}
let toastT;
function toast(msg) {
  if (!msg) return;
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3000);
}

/* ---- tela ---- */
function render() {
  $('#sTitle').textContent = C.TITULO;
  $('#sQuestion').textContent = C.PERGUNTA;

  const dg = $('#sDigits');
  dg.hidden = mode === 'branco';
  dg.replaceChildren(...Array.from({ length: LEN }, (_, i) =>
    h('span', { class: 'dig' + (mode === 'digitando' && i === entry.length ? ' cur' : '') }, entry[i] || '')));

  const info = $('#sInfo');
  info.replaceChildren();
  if (mode === 'branco') {
    info.append(h('div', { class: 'msg' }, 'VOTO EM BRANCO'), h('div', { class: 'hint' }, 'CONFIRMA para registrar, CORRIGE para voltar.'));
  } else if (entry.length === LEN) {
    const o = achar(entry);
    if (o) info.append(h('div', { class: 'pick' }, h('div', { class: 'sw', style: `background:${o.cor}` }), h('div', { class: 'nm' }, o.nome)),
      h('div', { class: 'hint' }, 'CONFIRMA para votar, CORRIGE para escolher outra.'));
    else info.append(h('div', { class: 'msg warn' }, 'NÚMERO ERRADO — VOTO NULO'), h('div', { class: 'hint' }, 'CORRIGE para tentar de novo ou CONFIRMA para anular.'));
  } else {
    info.append(h('div', { class: 'hint' }, 'Digite o número da sua opção.'));
  }
  if (erro) info.append(h('div', { class: 'hint bad' }, erro));
  if (mode === 'enviando') info.append(h('div', { class: 'hint' }, 'Enviando…'));

  const lista = $('#sOptions');
  lista.hidden = mode === 'branco';
  lista.replaceChildren(...ORDEM.map(o => {
    const casa = entry && o.n.startsWith(entry);
    return h('div', { class: 'opt' + (casa && entry.length === LEN ? ' match' : '') + (entry && !casa ? ' dim' : ''), style: `--c:${o.cor}` },
      h('span', { class: 'num' }, o.n), h('span', { class: 'nm' }, o.nome));
  }));

  const travado = mode === 'enviando' || mode === 'fim';
  document.querySelectorAll('.key,.act').forEach(b => { b.disabled = travado; });
}

function press(k) {
  if (mode === 'enviando' || mode === 'fim') return;
  if (k === 'C') { if (entry || mode === 'branco' || erro) { entry = ''; mode = 'digitando'; erro = ''; beep('key'); render(); } return; }
  if (k === 'B') { if (!entry && mode !== 'branco') { mode = 'branco'; erro = ''; beep('key'); render(); } else beep('err'); return; }
  if (k === 'OK') { confirmar(); return; }
  if (mode === 'branco' || entry.length >= LEN) { beep('err'); return; }
  entry += k; erro = ''; beep('key'); render();
}

async function confirmar() {
  let escolha = null;
  if (mode === 'branco') escolha = 'BRANCO';
  else if (entry.length === LEN) escolha = achar(entry) ? entry : 'NULO';
  if (!escolha) { beep('err'); return; }
  const voltar = mode;
  mode = 'enviando'; erro = ''; render();
  try { await DP.votar(escolha); }
  catch (e) {
    mode = voltar; erro = 'Não foi possível enviar seu voto. Verifique a internet e aperte CONFIRMA de novo.';
    beep('err'); render(); return;
  }
  marcarVotou();
  mode = 'fim'; beep('end'); render();
  // Sem responsável identificado não se pede contato de ninguém: a pessoa precisa saber com quem deixa o número.
  mostrar(C.RESPONSAVEL ? telaContato() : telaFinal());
}

/* ---- depois do voto ---- */
function mostrar(no) { const o = $('#over'); o.replaceChildren(no); o.hidden = false; }
function recomecar() { $('#over').hidden = true; entry = ''; mode = 'digitando'; erro = ''; render(); }

function normZap(v) {
  let d = v.replace(/\D/g, '').replace(/^0+/, '');
  if (d.length >= 12 && d.startsWith('55')) d = d.slice(2);
  return /^[1-9]\d{9,10}$/.test(d) ? '55' + d : null;
}

function telaContato() {
  const consentimento = 'Autorizo o ' + C.TITULO + ' a me enviar mensagens por WhatsApp. Meu voto é contado sem meu nome e sem ligação com este contato. ' +
    'Posso pedir para sair e apagar meus dados a qualquer momento' + (C.RESPONSAVEL ? ' falando com ' + C.RESPONSAVEL : '') + '.';
  const nome = h('input', { type: 'text', maxlength: 80, placeholder: 'Seu nome (opcional)', autocomplete: 'name', 'aria-label': 'Nome' });
  const tel = h('input', { type: 'tel', inputmode: 'tel', maxlength: 20, placeholder: 'WhatsApp com DDD', autocomplete: 'tel', 'aria-label': 'WhatsApp' });
  const ck = h('input', { type: 'checkbox' });
  const msg = h('div', { class: 'err', hidden: true });
  const enviar = h('button', { class: 'btn', type: 'button' }, 'Quero receber');
  enviar.addEventListener('click', async () => {
    msg.hidden = true;
    const erroMsg = t => { msg.textContent = t; msg.hidden = false; };
    const zap = normZap(tel.value);
    if (!zap) return erroMsg('Confira o WhatsApp: DDD + número (ex.: 11 91234-5678).');
    if (!ck.checked) return erroMsg('Marque a autorização para receber mensagens.');
    enviar.disabled = true;
    try { await DP.deixarContato(nome.value.trim(), zap, consentimento); }
    catch (e) { enviar.disabled = false; return erroMsg('Não foi possível salvar agora. Tente de novo.'); }
    toast('Contato salvo. Obrigado!');
    mostrar(telaFinal());
  });
  const pular = h('button', { class: 'btn alt', type: 'button', onclick: () => mostrar(telaFinal()) }, 'Agora não');
  return h('div', { style: 'display:contents' },
    h('h2', null, '✔ Voto registrado'),
    h('p', null, 'Quer receber novidades desta pesquisa no WhatsApp? É opcional e não muda nada no seu voto.'),
    nome, tel, h('label', { class: 'ck' }, ck, h('span', null, consentimento)), msg,
    h('div', { class: 'row' }, enviar, pular));
}

function telaFinal() {
  const ev = EVENTO;
  if (ev) setTimeout(recomecar, 7000);
  return h('div', { style: 'display:contents' },
    h('h2', null, 'Obrigado por participar!'),
    h('p', null, ev ? 'A urna volta sozinha para o próximo eleitor.' : 'Cada voto conta. Chame mais gente para mostrar a força do povo.'),
    h('div', { class: 'row' },
      h('a', { class: 'btn', href: 'resultado.html' }, 'Ver placar'),
      h('button', { class: 'btn alt', type: 'button', onclick: async () => toast(await DP.compartilhar()) }, 'Compartilhar'),
      ev ? h('button', { class: 'btn alt', type: 'button', onclick: recomecar }, 'Próximo eleitor') : null));
}

function telaJa() {
  return h('div', { style: 'display:contents' },
    h('h2', null, 'Você já votou neste aparelho'),
    h('p', null, 'Obrigado! Veja como está o placar e chame mais gente para votar.'),
    h('div', { class: 'row' },
      h('a', { class: 'btn', href: 'resultado.html' }, 'Ver placar'),
      h('button', { class: 'btn alt', type: 'button', onclick: async () => toast(await DP.compartilhar()) }, 'Compartilhar')));
}

/* ---- início ---- */
$('#keys').replaceChildren(...['1','2','3','4','5','6','7','8','9','0'].map(d =>
  h('button', { class: 'key' + (d === '0' ? ' zero' : ''), type: 'button', 'data-k': d, 'aria-label': 'Tecla ' + d }, d)));
document.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.target.closest('input,textarea')) return;
  if (e.target.closest('button,a') && (e.key === 'Enter' || e.key === ' ')) return;
  if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key === 'Enter') press('OK');
  else if (e.key === 'Backspace' || e.key === 'Escape' || e.key === 'Delete') press('C');
  else if (e.key.toLowerCase() === 'b') press('B');
  else return;
  e.preventDefault();
});
$('#teste').hidden = DP.remoto;
render();
if (jaVotou()) { mode = 'fim'; render(); mostrar(telaJa()); }
})();
</script>
</body>
</html>
