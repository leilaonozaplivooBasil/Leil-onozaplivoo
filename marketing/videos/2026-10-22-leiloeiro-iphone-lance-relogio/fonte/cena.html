<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Leiloeiro com o iPhone 17 Pro Max: lance atual + relógio de encerramento. 1080x1920.
     window.quadro(t) desenha o instante t. ?resta=<segundos até o fim> &lance=600 -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#00180d;font-family:"Inter Display","Inter",sans-serif;color:#fff}
  .cena{position:relative;width:1080px;height:1920px;overflow:hidden;
    background:radial-gradient(90% 60% at 50% 58%,#0a5a39 0%,#06402a 40%,#00180d 85%)}
  .raios{position:absolute;left:50%;top:1040px;width:2400px;height:2400px;margin:-1200px 0 0 -1200px;opacity:.10;
    background:repeating-conic-gradient(from 0deg,#3dff8a 0 4deg,transparent 4deg 18deg);
    -webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%)}
  .logo{position:absolute;top:96px;left:50%;width:300px;margin-left:-150px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.45))}

  .lance{position:absolute;top:330px;left:0;right:0;text-align:center}
  .rot{display:inline-flex;align-items:center;gap:14px;padding:12px 30px;border-radius:999px;
    background:rgba(61,255,138,.12);box-shadow:inset 0 0 0 2px rgba(61,255,138,.75);
    color:#7dffb4;font-weight:800;font-size:34px;letter-spacing:.16em}
  .rot i{width:16px;height:16px;border-radius:50%;background:#3dff8a;box-shadow:0 0 14px #3dff8a}
  .valor{margin-top:14px;font-weight:900;font-size:230px;line-height:1;letter-spacing:-.04em;
    background:linear-gradient(180deg,#fff3c4 0%,#f4c55e 48%,#d89a2c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 10px 30px rgba(0,0,0,.55))}
  .valor small{font-size:110px;letter-spacing:-.02em;margin-right:14px}

  .leiloeiro{position:absolute;left:-70px;top:720px;width:820px;height:1018px;background:url(a-iphone.webp) no-repeat 50% 100%/contain;
    transform-origin:50% 100%;filter:drop-shadow(0 30px 40px rgba(0,0,0,.5))}
  .brilho{position:absolute;left:-5px;top:965px;width:200px;height:320px;border-radius:40px;
    background:radial-gradient(closest-side,rgba(255,170,90,.55),transparent);filter:blur(10px)}

  .bloco{position:absolute;left:712px;top:800px;width:340px;padding:34px 0 30px;border-radius:44px;display:flex;flex-direction:column;align-items:center;
    background:linear-gradient(180deg,rgba(4,37,26,.9),rgba(1,24,13,.95));box-shadow:0 0 0 3px rgba(244,197,94,.85),0 24px 50px rgba(0,0,0,.55)}
  .relogio{position:relative;width:250px;height:250px}
  .anel{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 40%,#0f4d33,#04251a 70%);
    box-shadow:0 0 0 7px #3dff8a,0 0 50px 12px rgba(61,255,138,.45),0 24px 40px rgba(0,0,0,.6),inset 0 4px 0 rgba(255,255,255,.1)}
  .relogio svg{position:absolute;inset:0}
  .rot-rel{position:absolute;left:770px;top:1175px;width:290px;text-align:center;font-weight:800;font-size:30px;letter-spacing:.12em;color:#7dffb4}

  .conta{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .conta .txt{font-weight:800;font-size:28px;letter-spacing:.14em;color:#f4c55e}
  .conta .d{font-weight:900;font-size:64px;line-height:1.05}
  .conta .t{font-weight:900;font-size:62px;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .conta .t b{font-weight:900;color:#3dff8a}
  .rodape{position:absolute;left:60px;right:60px;top:1750px;padding:24px 0;border-radius:999px;text-align:center;font-weight:800;font-size:42px;color:#fff;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
  .rodape span{color:#f4c55e}
</style></head>
<body><div class="cena">
  <div class="raios" id="raios"></div>
  <img class="logo" src="logo-escuro.png" alt="">
  <div class="lance" id="lance">
    <div class="rot"><i id="ponto"></i>LANCE ATUAL</div>
    <div class="valor" id="valor"><small>R$</small><span id="num"></span></div>
  </div>
  <div class="brilho" id="brilho"></div>
  <div class="leiloeiro" id="leiloeiro"></div>
  <div class="bloco">
  <div class="relogio" id="relogio">
    <div class="anel" id="anel"></div>
    <svg viewBox="0 0 290 290">
      <g id="marcas"></g>
      <line id="pH" x1="145" y1="145" x2="145" y2="88" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
      <line id="pM" x1="145" y1="145" x2="145" y2="56" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
      <line id="pS" x1="145" y1="168" x2="145" y2="40" stroke="#f4c55e" stroke-width="4" stroke-linecap="round"/>
      <circle cx="145" cy="145" r="11" fill="#f4c55e"/>
    </svg>
  </div>
    <div class="conta"><span class="txt">ENCERRA EM</span><span class="d" id="dias"></span><span class="t" id="tempo"></span></div>
  </div>
  <div class="rodape">iPhone 17 Pro Max · <span>sábado, 24/10 às 18h</span></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const RESTA = Number(q.get('resta') || 0);   // segundos até o fim do leilão, na hora da gravação
document.getElementById('num').textContent = q.get('lance') || '600';
const m = document.getElementById('marcas');
for (let i = 0; i < 12; i++) {
  const a = i * 30 * Math.PI / 180, r1 = i % 3 ? 112 : 102;
  m.insertAdjacentHTML('beforeend', `<line x1="${145 + Math.sin(a) * r1}" y1="${145 - Math.cos(a) * r1}" x2="${145 + Math.sin(a) * 124}" y2="${145 - Math.cos(a) * 124}" stroke="${i % 3 ? 'rgba(255,255,255,.55)' : '#3dff8a'}" stroke-width="${i % 3 ? 4 : 7}" stroke-linecap="round"/>`);
}
const $ = (id) => document.getElementById(id);
const dois = (n) => String(n).padStart(2, '0');
const gira = (el, g) => el.setAttribute('transform', `rotate(${g} 145 145)`);
window.quadro = (t) => {
  // relógio: o ponteiro dos segundos anda de segundo em segundo, com um tranco curto como relógio de verdade
  const s = Math.max(0, RESTA - t);
  const inteiro = Math.ceil(s), frac = inteiro - s;            // 0 logo depois do tique
  const tranco = frac < 0.12 ? Math.sin(frac / 0.12 * Math.PI) * 1.8 : 0;
  const seg = (60 - (inteiro % 60)) % 60;
  gira($('pS'), seg * 6 + tranco);
  gira($('pM'), (60 - Math.floor(inteiro / 60) % 60) % 60 * 6);
  gira($('pH'), ((24 - Math.floor(inteiro / 3600) % 12) % 12) * 30);
  const d = Math.floor(inteiro / 86400), h = Math.floor(inteiro % 86400 / 3600), mi = Math.floor(inteiro % 3600 / 60), se = inteiro % 60;
  $('dias').textContent = d === 1 ? '1 dia' : `${d} dias`;
  $('tempo').innerHTML = `${dois(h)}<b>:</b>${dois(mi)}<b>:</b>${dois(se)}`;
  $('relogio').style.transform = `rotate(${Math.sin(t * Math.PI * 2) * (frac < 0.15 ? 2 : 0)}deg)`;
  $('anel').style.boxShadow = `0 0 0 7px #3dff8a,0 0 ${40 + 25 * (1 - Math.min(1, frac * 4))}px ${10 + 8 * (1 - Math.min(1, frac * 4))}px rgba(61,255,138,.5),0 24px 40px rgba(0,0,0,.6),inset 0 4px 0 rgba(255,255,255,.1)`;
  // leiloeiro respira e balança de leve; o iPhone brilha
  $('leiloeiro').style.transform = `translateY(${Math.sin(t * 2.1) * 10}px) rotate(${Math.sin(t * 1.4) * 1.2}deg)`;
  $('brilho').style.opacity = 0.55 + 0.45 * Math.sin(t * 3);
  $('brilho').style.transform = `translateY(${Math.sin(t * 2.1) * 10}px)`;
  // valor pulsa a cada 2 segundos
  const p = (t % 2) / 2, pulso = p < 0.18 ? Math.sin(p / 0.18 * Math.PI) : 0;
  $('valor').style.transform = `scale(${1 + pulso * 0.05})`;
  $('ponto').style.opacity = 0.4 + 0.6 * (Math.sin(t * 6) * 0.5 + 0.5);
  $('raios').style.transform = `rotate(${t * 4}deg)`;
};
window.quadro(0);
</script></body></html>
