<!doctype html>
<html><head><meta charset="utf-8">
<!-- Story 9:16 "Faltam 4 dias" — iPhone 17 Pro Max com o leiloeiro 3D. Cena gerada (story-cena-*.jpg), texto em HTML.
     Parâmetros: ?cena=story-cena-a.jpg  &n=4 -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#04150e}
  .stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"Inter Display","Inter",sans-serif;
    background-size:cover;background-position:center}
  .veu{position:absolute;inset:0;background:
    linear-gradient(180deg,rgba(3,18,12,.88) 0%,rgba(3,18,12,.55) 20%,rgba(3,18,12,0) 32%,rgba(3,18,12,0) 66%,rgba(3,18,12,.8) 80%,rgba(3,18,12,.94) 100%)}
  .topo{position:absolute;top:120px;left:0;right:0;display:flex;flex-direction:column;align-items:center}
  .logo{width:210px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
  .selo{display:inline-flex;align-items:center;gap:12px;margin-top:30px;padding:10px 24px;border-radius:999px;
    background:rgba(61,255,138,.12);box-shadow:inset 0 0 0 2px rgba(61,255,138,.7);
    color:#7dffb4;font-weight:800;font-size:24px;letter-spacing:.16em}
  .selo i{width:12px;height:12px;border-radius:50%;background:#3dff8a;box-shadow:0 0 12px #3dff8a}
  .conta{display:flex;align-items:center;gap:26px;margin-top:26px}
  .fw{font-weight:900;font-size:104px;letter-spacing:-.03em;line-height:1;color:#fff;text-shadow:0 8px 30px rgba(0,0,0,.6)}
  .fw.g{background:linear-gradient(180deg,#b6ffd3 0%,#3dff8a 45%,#12c964 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(61,255,138,.4))}
  .tile{position:relative;width:170px;height:196px;border-radius:30px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#0f4d33 0%,#0b3a27 49.6%,#06261a 50.4%,#0a3423 100%);
    box-shadow:0 0 0 4px rgba(61,255,138,.65),0 0 56px 12px rgba(61,255,138,.35),0 26px 44px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.12);
    font-weight:900;font-size:160px;line-height:1}
  .tile span{background:linear-gradient(180deg,#fff3c4 0%,#f4c55e 45%,#d89a2c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;transform:translateY(-5px)}
  .tile::after{content:"";position:absolute;left:0;right:0;top:50%;height:5px;margin-top:-2.5px;background:#041a11}
  .base{position:absolute;bottom:150px;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center}
  .para{font-weight:600;font-size:46px;color:#eef6f0;text-shadow:0 4px 16px rgba(0,0,0,.6)}
  .prod{margin-top:6px;font-weight:800;font-size:96px;letter-spacing:-.02em;line-height:1.05;white-space:nowrap;
    background:linear-gradient(180deg,#fff3c4 0%,#f4c55e 50%,#d89a2c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px rgba(0,0,0,.5))}
  .data{display:inline-flex;align-items:center;gap:14px;margin-top:34px;padding:22px 38px;border-radius:999px;
    border:2px solid rgba(255,255,255,.35);background:rgba(3,22,14,.65);
    color:#fff;font-weight:800;font-size:44px;letter-spacing:.02em;white-space:nowrap}
  .data svg{width:44px;height:44px}
  .data .dot{color:#3dff8a;margin:0 2px}
</style></head>
<body><div class="stage" id="st">
  <div class="veu"></div>
  <div class="topo">
    <img class="logo" src="logo.png">
    <div class="selo"><i></i>CONTAGEM REGRESSIVA</div>
    <div class="conta"><span class="fw">FALTAM</span><div class="tile"><span id="n">4</span></div><span class="fw g">DIAS</span></div>
  </div>
  <div class="base">
    <div class="para">para o leilão do nosso</div>
    <div class="prod">iPhone 17 Pro Max</div>
    <div class="data"><svg viewBox="0 0 24 24" fill="none" stroke="#3dff8a" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>SÁB <span class="dot">•</span> 24/10 <span class="dot">•</span> ÀS 18H</div>
  </div>
</div>
<script>
const q=new URLSearchParams(location.search), st=document.getElementById('st');
if(q.get('n')) document.getElementById('n').textContent=q.get('n');
st.style.backgroundImage=`url(${q.get('cena')||'story-cena-a.jpg'})`;
</script></body></html>
