<!doctype html><html><head><meta charset="utf-8">
<!-- Tela do celular da Leila: câmera fotografando um produto (230x500 lógico, render 4x) -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:230px;height:500px;overflow:hidden;background:#000;font-family:"Inter",sans-serif;color:#fff}
.s{position:relative;width:230px;height:500px;background:#000}
.status{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 22px;font-weight:600;font-size:9px}
.status .ic{display:flex;gap:4px;align-items:center}
.view{position:absolute;left:0;right:0;top:44px;height:330px;overflow:hidden;background:#fff}
.view img{position:absolute;left:50%;top:50%;width:300px;transform:translate(-50%,-48%)}
.grid{position:absolute;inset:0;background:
  linear-gradient(90deg,transparent 33.1%,rgba(255,255,255,.55) 33.3%,transparent 33.5%,transparent 66.4%,rgba(255,255,255,.55) 66.6%,transparent 66.8%),
  linear-gradient(0deg,transparent 33.1%,rgba(255,255,255,.55) 33.3%,transparent 33.5%,transparent 66.4%,rgba(255,255,255,.55) 66.6%,transparent 66.8%)}
.focus{position:absolute;left:78px;top:118px;width:74px;height:74px;border:1.5px solid #ffd60a;border-radius:3px}
.focus::after{content:"";position:absolute;left:50%;top:-5px;width:1.5px;height:8px;background:#ffd60a}
.zoom{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px}
.zoom span{width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.45);font-size:7.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.zoom span.on{color:#ffd60a;width:26px;height:26px;margin-top:-2px}
.top{position:absolute;left:0;right:0;top:26px;height:18px;display:flex;justify-content:space-between;align-items:center;padding:0 14px}
.notif{position:absolute;left:8px;right:8px;top:52px;border-radius:14px;padding:8px 9px;display:flex;gap:8px;align-items:center;
  background:rgba(245,245,247,.94);color:#111;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.notif img{width:26px;height:26px;border-radius:7px;object-fit:cover;object-position:0 50%;background:#0b3d29}
.notif .t{font-size:7.6px;line-height:1.25}
.notif .t b{display:block;font-size:8px}
.notif .t span{color:#0f8a4a;font-weight:800}
.modes{position:absolute;left:0;right:0;top:384px;display:flex;justify-content:center;gap:16px;font-size:8.5px;font-weight:600;letter-spacing:.06em;color:#ddd}
.modes .on{color:#ffd60a}
.bar{position:absolute;left:0;right:0;top:410px;height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.thumb{width:34px;height:34px;border-radius:7px;background:#fff url(produto.jpg) center/cover;border:1.5px solid #fff}
.shutter{width:58px;height:58px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center}
.shutter i{width:44px;height:44px;border-radius:50%;background:#fff}
.flip{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.flip svg{width:18px;height:18px}
</style></head><body><div class="s">
  <div class="status"><span>18:00</span><span class="ic">
    <svg width="14" height="9" viewBox="0 0 14 9"><g fill="#fff"><rect x="0" y="6" width="2.4" height="3" rx=".6"/><rect x="3.8" y="4" width="2.4" height="5" rx=".6"/><rect x="7.6" y="2" width="2.4" height="7" rx=".6"/><rect x="11.4" y="0" width="2.4" height="9" rx=".6"/></g></svg>
    <svg width="18" height="9" viewBox="0 0 18 9"><rect x=".5" y=".5" width="15" height="8" rx="2.2" fill="none" stroke="#fff" opacity=".6"/><rect x="2" y="2" width="11" height="5" rx="1.2" fill="#fff"/><rect x="16.3" y="3" width="1.4" height="3" rx=".6" fill="#fff" opacity=".6"/></svg></span></div>
  <div class="top">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
  </div>
  <div class="view"><img src="produto.jpg"><div class="grid"></div><div class="focus"></div>
    <div class="zoom"><span>.5</span><span class="on">1×</span><span>2</span></div></div>
  <div class="modes"><span>VÍDEO</span><span class="on">FOTO</span><span>RETRATO</span></div>
  <div class="bar"><div class="thumb"></div><div class="shutter"><i></i></div>
    <div class="flip"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3l-2-3H9L7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/><path d="M9 13a3 3 0 0 1 5-2.2M15 13a3 3 0 0 1-5 2.2"/></svg></div></div>
</div></body></html>
