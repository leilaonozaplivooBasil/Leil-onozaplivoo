<!doctype html>
<html><head><meta charset="utf-8">
<!-- Banner 1920x1080 · Programa de influenciadores (Leila fotografando com o celular) -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#06261a}
  .stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:"Inter Display","Inter",sans-serif;color:#fff;
    background:
      radial-gradient(ellipse 700px 600px at 1560px 560px, rgba(244,197,94,.16), rgba(244,197,94,0) 70%),
      radial-gradient(ellipse 1100px 900px at 1050px 450px, #12583c 0%, #0b3d29 45%, #062418 100%)}
  .bokeh{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,206,140,.55),rgba(255,206,140,0) 70%);filter:blur(4px)}
  .leila{position:absolute;left:0;top:0;height:1080px;
    -webkit-mask-image:linear-gradient(90deg,#000 0,#000 74%,rgba(0,0,0,.75) 86%,transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 74%,rgba(0,0,0,.75) 86%,transparent 100%)}
  .swoosh{position:absolute;bottom:-1px;left:0;width:1920px;height:260px}
  .swoosh-top{position:absolute;left:0;top:0;width:2000px;height:360px;transform:rotate(180deg);transform-origin:1000px 180px}
  /* ícones flutuando perto do celular */
  .float{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;
    box-shadow:0 12px 28px rgba(0,0,0,.4)}
  .float svg{width:56%;height:56%}
  .txt{position:absolute;left:820px;top:96px;width:1060px}
  .logo{width:300px;display:block;margin:0 0 40px -4px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
  .h{font-weight:900;letter-spacing:-.025em;line-height:.95;white-space:nowrap}
  .gold{background:linear-gradient(180deg,#ffe7a6 0%,#f4c55e 45%,#d89a2c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 0 #5a3a07) drop-shadow(0 0 30px rgba(244,197,94,.45));display:inline-block;padding:0 8px 10px 0}
  .neon{color:#3dff8a;text-shadow:0 0 30px rgba(61,255,138,.55)}
  .row{display:flex;align-items:center;gap:30px;margin-top:22px}
  .pct{font-size:300px;line-height:.8;letter-spacing:-.05em}
  .side{font-weight:900;font-size:58px;line-height:1.02;letter-spacing:-.015em}
  .ganhe{display:inline-block;font-weight:900;font-size:44px;letter-spacing:.06em;padding:12px 26px;border-radius:999px;margin-bottom:16px;
    background:linear-gradient(180deg,#4dff95,#16c964);color:#04210f;box-shadow:0 0 0 4px rgba(61,255,138,.22),0 0 30px 6px rgba(61,255,138,.35)}
</style></head>
<body><div class="stage">
  <div class="bokeh" style="left:1180px;top:60px;width:90px;height:90px"></div>
  <div class="bokeh" style="left:1840px;top:820px;width:110px;height:110px;opacity:.6"></div>
  <div class="bokeh" style="left:1120px;top:780px;width:70px;height:70px;opacity:.5"></div>
  <img class="leila" src="leila-camera.png">
  <!-- coração, câmera e moeda (sem texto) -->
  <div class="float" style="left:300px;top:170px;width:84px;height:84px;background:linear-gradient(180deg,#ff6b81,#e8344f);transform:rotate(-10deg)">
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 21s-7.5-4.6-9.5-9.3C1.1 8.4 3.2 5 6.6 5c2 0 3.6 1.1 5.4 3 1.8-1.9 3.4-3 5.4-3 3.4 0 5.5 3.4 4.1 6.7C19.5 16.4 12 21 12 21z"/></svg></div>
  <div class="float" style="left:392px;top:96px;width:58px;height:58px;background:linear-gradient(180deg,#ff6b81,#e8344f);transform:rotate(12deg);opacity:.9">
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 21s-7.5-4.6-9.5-9.3C1.1 8.4 3.2 5 6.6 5c2 0 3.6 1.1 5.4 3 1.8-1.9 3.4-3 5.4-3 3.4 0 5.5 3.4 4.1 6.7C19.5 16.4 12 21 12 21z"/></svg></div>
  <div class="float" style="left:250px;top:300px;width:70px;height:70px;background:radial-gradient(circle at 35% 30%,#ffe7a6,#f4c55e 45%,#c08427)">
    <svg viewBox="0 0 24 24" fill="none" stroke="#0a3d27" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M16 8.5c0-1.4-1.8-2.5-4-2.5s-4 1.1-4 2.5 1.8 2.3 4 2.8 4 1.4 4 2.9-1.8 2.8-4 2.8-4-1.2-4-2.6"/></svg></div>
  <svg class="swoosh" viewBox="0 0 1920 260" preserveAspectRatio="none">
    <defs><linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#b8862b"/><stop offset=".5" stop-color="#ffe3a0"/><stop offset="1" stop-color="#c8952f"/></linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14613f"/><stop offset="1" stop-color="#083a25"/></linearGradient></defs>
    <path d="M1920 70 C 1720 170, 1480 240, 1180 262 L1920 262 Z" fill="url(#gr)"/>
    <path d="M1920 70 C 1720 170, 1480 240, 1180 262" stroke="url(#gold)" stroke-width="5" fill="none"/>
  </svg>
  <svg class="swoosh-top" viewBox="0 0 1920 260" preserveAspectRatio="none">
    <path d="M1920 70 C 1720 170, 1480 240, 1180 262 L1920 262 Z" fill="url(#gr)"/>
    <path d="M1920 70 C 1720 170, 1480 240, 1180 262" stroke="url(#gold)" stroke-width="5" fill="none"/>
  </svg>
  <div class="txt">
    <img class="logo" src="logo.png">
    <div class="h" style="font-size:84px">SEJA UM</div>
    <div class="h gold" style="font-size:118px;margin-top:4px">INFLUENCIADOR</div>
    <div class="h neon" style="font-size:96px;margin-top:-4px">GRÁTIS</div>
    <div class="row">
      <div class="h gold pct">5%</div>
      <div><div class="ganhe">E GANHE</div><div class="side">DE TODAS AS<br>VENDAS QUE<br>FIZER</div></div>
    </div>
  </div>
</div></body></html>
