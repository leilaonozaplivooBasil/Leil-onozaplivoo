<!doctype html>
<html><head><meta charset="utf-8">
<!-- Banners 1920x1080 · Programa de influenciadores · variações #a (camisa) #b (TV) #c (iPhone)
     Copy: "POSTOU, VENDEU, GANHOU!" + "Seja influenciador da Leilão No Zap e ganhe 5% de cada venda. É grátis!" -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#06261a}
  .stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:"Inter Display","Inter",sans-serif;color:#fff;
    background:
      radial-gradient(ellipse 700px 600px at 1560px 560px, rgba(244,197,94,.16), rgba(244,197,94,0) 70%),
      radial-gradient(ellipse 1100px 900px at 1050px 450px, #12583c 0%, #0b3d29 45%, #062418 100%)}
  .bokeh{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,206,140,.55),rgba(255,206,140,0) 70%);filter:blur(4px)}
  .rays{position:absolute;left:1380px;top:560px;width:1600px;height:1600px;margin:-800px 0 0 -800px;border-radius:50%;opacity:.5;
    background:repeating-conic-gradient(from 0deg,rgba(244,197,94,.18) 0deg 6deg,rgba(244,197,94,0) 6deg 15deg);
    -webkit-mask-image:radial-gradient(circle,#000 0,#000 20%,transparent 60%);mask-image:radial-gradient(circle,#000 0,#000 20%,transparent 60%)}
  .leila{position:absolute;left:0;top:0;height:1080px;
    -webkit-mask-image:linear-gradient(90deg,#000 0,#000 74%,rgba(0,0,0,.55) 81%,transparent 87%);mask-image:linear-gradient(90deg,#000 0,#000 74%,rgba(0,0,0,.55) 81%,transparent 87%)}
  .swoosh{position:absolute;bottom:-1px;left:0;width:1920px;height:260px}
  .swoosh-top{position:absolute;left:0;top:0;width:2000px;height:360px;transform:rotate(180deg);transform-origin:1000px 180px}
  .float{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;box-shadow:0 12px 28px rgba(0,0,0,.4)}
  .float svg{width:56%;height:56%}
  .heart{background:linear-gradient(180deg,#ff6b81,#e8344f)}
  .coin{background:radial-gradient(circle at 35% 30%,#ffe7a6,#f4c55e 45%,#c08427)}
  .cart{background:linear-gradient(180deg,#5dffa0,#22c96a)}
  .logo{width:280px;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
  .h{font-weight:900;letter-spacing:-.025em;line-height:.95;white-space:nowrap}
  .gold{background:linear-gradient(180deg,#ffe7a6 0%,#f4c55e 45%,#d89a2c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 0 #5a3a07) drop-shadow(0 0 30px rgba(244,197,94,.45));display:inline-block;padding:0 8px 10px 0}
  .neon{color:#3dff8a}
  .sub{font-weight:700;font-size:44px;line-height:1.22;color:#eef6f0}
  .sub b{font-weight:900}
  .sub .g{color:#f4c55e}
  .gratis{display:inline-flex;align-items:center;gap:14px;font-weight:900;font-size:50px;letter-spacing:.01em;padding:14px 34px 14px 26px;border-radius:999px;
    background:linear-gradient(180deg,#4dff95,#16c964);color:#04210f;box-shadow:0 0 0 5px rgba(61,255,138,.22),0 0 40px 8px rgba(61,255,138,.4),0 14px 30px rgba(0,0,0,.35)}
  .gratis svg{width:44px;height:44px}
  /* A · passo a passo */
  .step{display:flex;align-items:center;gap:30px;margin-bottom:14px}
  .ico{flex:0 0 auto;width:112px;height:112px;border-radius:30px;display:flex;align-items:center;justify-content:center;
    background:rgba(4,30,20,.6);border:3px solid rgba(244,197,94,.7);box-shadow:0 14px 30px rgba(0,0,0,.35)}
  .ico svg{width:60px;height:60px}
  /* C · chips + cartão */
  .chips{display:flex;gap:16px}
  .chip{font-weight:900;font-size:60px;letter-spacing:-.02em;padding:12px 28px 16px;border-radius:24px;background:rgba(4,30,20,.6);border:3px solid rgba(255,255,255,.25);white-space:nowrap}
  .chip.on{background:linear-gradient(180deg,#ffe7a6,#f4c55e 50%,#d89a2c);color:#062418;border-color:#ffe7a6;box-shadow:0 0 40px rgba(244,197,94,.5)}
  .card{border-radius:40px;padding:3px;background:linear-gradient(135deg,#ffe3a0,#b8862b 40%,#ffe3a0 70%,#c8952f);box-shadow:0 22px 50px rgba(0,0,0,.5)}
  .card-in{border-radius:37px;display:flex;align-items:center;gap:40px;padding:36px 44px;
    background:radial-gradient(ellipse 600px 300px at 30% 0%,#1b7a50 0%,#0f5636 55%,#0a3d27 100%)}
  .bigcoin{flex:0 0 auto;width:250px;height:250px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 28%,#fff2c8,#f4c55e 45%,#c08427 100%);
    box-shadow:0 0 0 10px rgba(255,231,166,.25),0 0 0 16px rgba(10,61,39,.9),0 0 0 20px #f4c55e,0 0 60px rgba(244,197,94,.5);
    font-weight:900;font-size:130px;letter-spacing:-.05em;color:#0a3d27}
  .v{display:none}
</style></head>
<body><div class="stage">
  <div class="rays v vb"></div>
  <div class="bokeh" style="left:1180px;top:60px;width:90px;height:90px"></div>

  <div class="bokeh" style="left:1120px;top:780px;width:70px;height:70px;opacity:.5"></div>
  <img class="leila" id="leila">

  <!-- ícones flutuando perto do celular -->
  <div class="v va">
    <div class="float heart" style="left:300px;top:170px;width:84px;height:84px;transform:rotate(-10deg)"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 21s-7.5-4.6-9.5-9.3C1.1 8.4 3.2 5 6.6 5c2 0 3.6 1.1 5.4 3 1.8-1.9 3.4-3 5.4-3 3.4 0 5.5 3.4 4.1 6.7C19.5 16.4 12 21 12 21z"/></svg></div>
    <div class="float heart" style="left:396px;top:92px;width:58px;height:58px;transform:rotate(12deg)"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 21s-7.5-4.6-9.5-9.3C1.1 8.4 3.2 5 6.6 5c2 0 3.6 1.1 5.4 3 1.8-1.9 3.4-3 5.4-3 3.4 0 5.5 3.4 4.1 6.7C19.5 16.4 12 21 12 21z"/></svg></div>
    <div class="float coin" style="left:250px;top:300px;width:70px;height:70px"><svg viewBox="0 0 24 24" fill="none" stroke="#0a3d27" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M16 8.5c0-1.4-1.8-2.5-4-2.5s-4 1.1-4 2.5 1.8 2.3 4 2.8 4 1.4 4 2.9-1.8 2.8-4 2.8-4-1.2-4-2.6"/></svg></div>

  </div>
  <div class="v vc">
    <div class="float coin" style="left:296px;top:150px;width:96px;height:96px;transform:rotate(-12deg)"><svg viewBox="0 0 24 24" fill="none" stroke="#0a3d27" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M16 8.5c0-1.4-1.8-2.5-4-2.5s-4 1.1-4 2.5 1.8 2.3 4 2.8 4 1.4 4 2.9-1.8 2.8-4 2.8-4-1.2-4-2.6"/></svg></div>
    <div class="float coin" style="left:410px;top:86px;width:64px;height:64px;transform:rotate(14deg)"><svg viewBox="0 0 24 24" fill="none" stroke="#0a3d27" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M16 8.5c0-1.4-1.8-2.5-4-2.5s-4 1.1-4 2.5 1.8 2.3 4 2.8 4 1.4 4 2.9-1.8 2.8-4 2.8-4-1.2-4-2.6"/></svg></div>
    <div class="float coin" style="left:244px;top:300px;width:60px;height:60px;transform:rotate(-20deg)"><svg viewBox="0 0 24 24" fill="none" stroke="#0a3d27" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M16 8.5c0-1.4-1.8-2.5-4-2.5s-4 1.1-4 2.5 1.8 2.3 4 2.8 4 1.4 4 2.9-1.8 2.8-4 2.8-4-1.2-4-2.6"/></svg></div>
  </div>

  <svg class="swoosh" viewBox="0 0 1920 260" preserveAspectRatio="none">
    <defs><linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#b8862b"/><stop offset=".5" stop-color="#ffe3a0"/><stop offset="1" stop-color="#c8952f"/></linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14613f"/><stop offset="1" stop-color="#083a25"/></linearGradient></defs>
    <path d="M1920 70 C 1720 170, 1480 240, 1180 262 L1920 262 Z" fill="url(#gr)"/>
    <path d="M1920 70 C 1720 170, 1480 240, 1180 262" stroke="url(#gold)" stroke-width="5" fill="none"/>
  </svg>
  <svg class="swoosh-top" viewBox="0 0 1920 260" preserveAspectRatio="none">
    <path d="M1920 70 C 1720 170, 1480 240, 1180 262 L1920 262 Z" fill="url(#gr)"/>
    <path d="M1920 70 C 1720 170, 1480 240, 1180 262" stroke="url(#gold)" stroke-width="5" fill="none"/>
  </svg>

  <!-- ===== A · passo a passo ===== -->
  <div class="v va" style="position:absolute;left:840px;top:80px;width:1040px">

    <div class="step"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#f4c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3l-2-3H9L7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/><circle cx="12" cy="13" r="3.5"/></svg></div><div class="h" style="font-size:118px">POSTOU,</div></div>

    <div class="step"><div class="ico" style="background:linear-gradient(180deg,#ffe7a6,#f4c55e 50%,#d89a2c);border-color:#ffe7a6"><svg viewBox="0 0 24 24" fill="none" stroke="#0a3d27" stroke-width="2.4" stroke-linecap="round"><path d="M12 4v16M16.5 7.5c0-1.6-2-2.8-4.5-2.8S7.5 5.9 7.5 7.5s2 2.6 4.5 3.1 4.5 1.6 4.5 3.3-2 3.1-4.5 3.1-4.5-1.3-4.5-2.9"/></svg></div><div class="h gold" style="font-size:132px">GANHOU!</div></div>
    <div class="sub" style="margin-top:22px;width:1020px">Seja influenciador da <b>Leilão No Zap</b> e ganhe <b class="g">5% de cada venda</b>. <b class="neon">É grátis!</b></div>
  </div>

  <!-- ===== B · headline + 5% gigante ===== -->
  <div class="v vb" style="position:absolute;left:840px;top:84px;width:1040px">
    <img class="logo" src="logo.png" style="margin-bottom:40px">

    <div class="h gold" style="font-size:150px;margin-top:6px">GANHOU!</div>
    <div style="display:flex;align-items:center;gap:36px;margin-top:18px">
      <div class="h gold" style="font-size:270px;line-height:.82;letter-spacing:-.05em">5%</div>
      <div class="sub" style="font-size:42px;width:560px">Seja influenciador da <b>Leilão No Zap</b> e ganhe <b class="g">5% de cada venda</b>.</div>
    </div>
    <div class="gratis" style="margin-top:34px"><svg viewBox="0 0 24 24" fill="none" stroke="#04210f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>É grátis!</div>
  </div>

</div>
<script>

document.querySelectorAll('.v'+v).forEach(e=>e.style.display='block');
document.getElementById('leila').src={a:'leila-camera-camisa.png',b:'leila-camera-tv.png',c:'leila-camera-iphone.png'}[v];
</script>
</body></html>
