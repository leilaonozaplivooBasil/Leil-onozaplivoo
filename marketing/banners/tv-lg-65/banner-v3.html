<!doctype html>
<html><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#06261a}
  .stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:"Inter Display","Inter",sans-serif;
    background:
      radial-gradient(ellipse 700px 600px at 1500px 520px, rgba(255,150,70,.22), rgba(255,150,70,0) 70%),
      radial-gradient(ellipse 1100px 900px at 1050px 450px, #12583c 0%, #0b3d29 45%, #062418 100%);}
  /* ripas de madeira com luz quente (fundo direito) */
  .slats{position:absolute;right:0;top:0;width:620px;height:760px;opacity:.35;
    background:repeating-linear-gradient(90deg,#3a2414 0 26px,#5b3a20 26px 30px,#2a190d 30px 34px);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 35%),linear-gradient(0deg,transparent,#000 40%);
    -webkit-mask-composite:source-in;mask-composite:intersect}
  .slats::after{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:#ffcf8a;box-shadow:0 0 40px 18px rgba(255,190,110,.55)}
  .bokeh{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,206,140,.55),rgba(255,206,140,0) 70%);filter:blur(4px)}
  .leafs{position:absolute;filter:blur(5px);opacity:.75}
  .leaf{position:absolute;border-radius:0 100% 0 100%;background:linear-gradient(135deg,#1f7a48,#0b3b23)}
  /* Leila */
  .leila{position:absolute;left:0;top:0;height:1080px;
    -webkit-mask-image:linear-gradient(90deg,#000 0,#000 74%,rgba(0,0,0,.75) 86%,transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 74%,rgba(0,0,0,.75) 86%,transparent 100%)}
  .leila-shade{position:absolute;left:0;top:0;width:820px;height:1080px;
    background:linear-gradient(90deg,rgba(6,36,24,0) 40%,rgba(8,46,31,.4) 68%,rgba(11,60,40,.35) 85%,rgba(11,60,40,0) 100%)}
  /* curvas verdes com filete dourado */
  .swoosh{position:absolute;bottom:-1px;width:1920px;height:260px}
  /* texto */
  .txt{position:absolute;left:760px;top:150px;width:430px;white-space:nowrap}
  .logo{width:210px;display:block;margin:0 0 34px -6px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
  .kicker{display:inline-flex;align-items:center;gap:12px;padding:10px 22px 10px 16px;border-radius:999px;
    border:2px solid rgba(61,255,138,.6);background:rgba(4,30,20,.45);color:#7dffb4;font-weight:800;font-size:15px;letter-spacing:.1em}
  .kicker .dot{width:14px;height:14px;border-radius:50%;background:#3dff8a;box-shadow:0 0 0 5px rgba(61,255,138,.25),0 0 14px 2px rgba(61,255,138,.8)}
  .falta{margin:24px 0 14px;font-weight:800;font-size:38px;letter-spacing:.06em;color:#fff;line-height:1}
  .count{display:flex;align-items:center;gap:18px}
  .slash{font-weight:800;font-size:130px;line-height:1;color:#f4c55e;opacity:.9;margin:0 -4px}
  .tile{position:relative;width:140px;height:170px;border-radius:26px;
    background:linear-gradient(180deg,#0f4d33 0%,#0b3a27 49.6%,#06261a 50.4%,#0a3423 100%);
    box-shadow:0 0 0 3px rgba(61,255,138,.55),0 0 40px 8px rgba(61,255,138,.35),0 24px 40px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.12);
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:158px;line-height:1;letter-spacing:-.03em}
  .tile span{background:linear-gradient(180deg,#ffe7a6 0%,#f4c55e 45%,#d89a2c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;transform:translateY(-4px)}
  .tile::after{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:#041a11;box-shadow:0 1px 0 rgba(255,255,255,.08)}
  .tile::before{content:"";position:absolute;top:50%;width:12px;height:24px;margin-top:-12px;left:-6px;right:-6px;border-radius:4px;
    background:#041a11;box-shadow:146px 0 0 #041a11}
  .unit{font-weight:900;font-size:100px;margin-left:4px;line-height:.9;letter-spacing:-.02em;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.35)}
  .para{margin-top:30px;font-weight:600;font-size:36px;line-height:1.15;color:#eef6f0}
  .prod{margin-top:24px;font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.02em;
    background:linear-gradient(180deg,#ffe7a6 0%,#f4c55e 45%,#d89a2c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px rgba(0,0,0,.35))}
  .para2{margin-top:4px;font-weight:600;font-size:28px;color:#eef6f0}
  .date{display:inline-flex;align-items:center;gap:12px;margin-top:24px;padding:12px 26px 12px 18px;border-radius:999px;
    background:linear-gradient(180deg,#4dff95,#16c964);color:#04210f;font-weight:700;font-size:28px;
    box-shadow:0 0 0 4px rgba(61,255,138,.22),0 0 30px 6px rgba(61,255,138,.35),0 12px 26px rgba(0,0,0,.35)}
  .date b{font-weight:900}
  .date svg{width:28px;height:28px}
  /* balão de fala da Leila */
  .bubble{position:absolute;left:250px;top:842px;z-index:4;filter:drop-shadow(0 16px 30px rgba(0,0,0,.45))}
  .b-in{position:relative;background:#fff;color:#14261c;border-radius:30px;padding:24px 34px;font-weight:600;font-size:34px;line-height:1.2;white-space:nowrap}
  .b-in b{color:#0f8a4a;font-weight:800}
  .b-in::before{content:"";position:absolute;left:120px;top:-26px;border:20px solid transparent;border-bottom:28px solid #fff;border-top:0;transform:skewX(18deg)}
  /* produto */
  .glow{position:absolute;left:1545px;top:515px;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,150,70,.35),rgba(255,150,70,0) 60%)}
  .tv{position:absolute;left:1225px;top:285px;width:670px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))}

  /* ===== layout v2 ===== */
  .arch{position:absolute;left:95px;top:85px;width:440px;height:586px;border-radius:220px 220px 30px 30px;overflow:hidden;
    box-shadow:0 0 0 7px #3dff8a,0 0 34px 10px rgba(61,255,138,.55),0 30px 50px rgba(0,0,0,.5)}
  .arch img{width:100%;height:100%;object-fit:cover;display:block}
  .logo2{position:absolute;left:105px;top:615px;width:420px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.55))}
  .kick2{position:absolute;left:315px;top:815px;transform:translateX(-50%);white-space:nowrap;display:inline-flex;align-items:center;gap:12px;
    padding:12px 24px 12px 18px;border-radius:999px;border:2px solid rgba(61,255,138,.6);background:rgba(4,30,20,.55);color:#7dffb4;
    font-weight:800;font-size:19px;letter-spacing:.12em}
  .kick2 .dot{width:14px;height:14px;border-radius:50%;background:#3dff8a;box-shadow:0 0 0 5px rgba(61,255,138,.25),0 0 14px 2px rgba(61,255,138,.8)}
  .right{position:absolute;left:700px;top:60px;width:1200px;white-space:nowrap}
  .contagem{font-weight:800;font-size:92px;line-height:1;letter-spacing:-.02em;padding:0 20px 10px 0;display:inline-block;
    background:linear-gradient(180deg,#ffe7a6 0%,#f4c55e 45%,#d89a2c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 0 #5a3a07) drop-shadow(0 0 24px rgba(244,197,94,.45))}
  .nome{margin-top:12px;font-weight:900;font-size:64px;line-height:1.02;letter-spacing:-.02em;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.4)}
  .nome .verde{color:#3dff8a}
  .data2{position:absolute;left:700px;top:930px;font-weight:900;font-size:58px;line-height:1.05;letter-spacing:-.02em;color:#fff;
    text-shadow:0 6px 30px rgba(0,0,0,.4);padding-left:30px;border-left:10px solid #3dff8a;white-space:nowrap}
  .data2 .g{color:#3dff8a}
  .tv2{position:absolute;left:1010px;top:395px;width:880px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.5))}
  .glow{left:1450px !important;top:640px !important}
  .leila3{position:absolute;left:0;top:0;height:1080px;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 70%,rgba(0,0,0,.7) 85%,transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 70%,rgba(0,0,0,.7) 85%,transparent 100%)}
  .logo3{position:absolute;left:40px;top:34px;width:260px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.5))}
</style></head>
<body><div class="stage">
  <div class="slats"></div>
  <div class="bokeh" style="left:1180px;top:60px;width:90px;height:90px"></div>
  <div class="bokeh" style="left:1840px;top:820px;width:110px;height:110px;opacity:.6"></div>
  <div class="bokeh" style="left:600px;top:900px;width:70px;height:70px;opacity:.5"></div>
  <div class="glow"></div>
  <img class="tv2" src="tv.png">
  <svg class="swoosh" viewBox="0 0 1920 260" preserveAspectRatio="none">
    <defs><linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#b8862b"/><stop offset=".5" stop-color="#ffe3a0"/><stop offset="1" stop-color="#c8952f"/></linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14613f"/><stop offset="1" stop-color="#083a25"/></linearGradient></defs>
    <path d="M0 150 C 180 200, 330 250, 520 262 L0 262 Z" fill="url(#gr)"/>
    <path d="M0 150 C 180 200, 330 250, 520 262" stroke="url(#gold)" stroke-width="5" fill="none"/>
    <path d="M1920 70 C 1720 170, 1480 240, 1180 262 L1920 262 Z" fill="url(#gr)"/>
    <path d="M1920 70 C 1720 170, 1480 240, 1180 262" stroke="url(#gold)" stroke-width="5" fill="none"/>
  </svg>
  <img class="leila3" src="leila-tv.png">
  <img class="logo3" src="logo.png">
  <div class="right">
    <div class="contagem" id="contagem">FALTA 1 DIA</div>
    <div class="nome">SMART TV LG UHD AI UA75<br><span class="verde">65 POLEGADAS</span> · HDR10</div>
  </div>
  <div class="data2" id="data">SÁBADO · <span class="g">10/10</span> ÀS 18H</div>
</div>
<script>
  // banner-v2.html#contagem=FALTA%201%20DIA&dia=SÁBADO
  const q=new URLSearchParams(location.hash.slice(1));
  if(q.get('contagem')) document.getElementById('contagem').textContent=q.get('contagem');
  if(q.get('tam')) document.getElementById('contagem').style.fontSize=q.get('tam')+'px';
  if(q.get('dia')) document.getElementById('data').innerHTML=q.get('dia')+' · <span class="g">10/10</span> ÀS 18H';
</script></body></html>
