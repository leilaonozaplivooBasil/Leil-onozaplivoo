<!doctype html>
<html><head><meta charset="utf-8">
<!-- Story 1080x1920 — Leila com o iPhone 17 Pro Max: o martelo bate sábado, 24/10, às 18h; lance atual R$ 297.
     Mesma identidade do banner do iPhone (contagem-iphone-17-pro-max). Textos-chave entre 250px e 1670px (fora da área dos botões do Instagram). -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#06261a}
  .stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"Inter Display","Inter",sans-serif;
    background:
      radial-gradient(ellipse 700px 600px at 860px 1200px, rgba(255,150,70,.22), rgba(255,150,70,0) 70%),
      radial-gradient(ellipse 1000px 1100px at 540px 640px, #12583c 0%, #0b3d29 45%, #062418 100%);}
  .slats{position:absolute;right:0;top:0;width:520px;height:900px;opacity:.28;
    background:repeating-linear-gradient(90deg,#3a2414 0 26px,#5b3a20 26px 30px,#2a190d 30px 34px);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 40%),linear-gradient(0deg,transparent,#000 50%);-webkit-mask-composite:source-in}
  .bokeh{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,206,140,.5),rgba(255,206,140,0) 70%);filter:blur(4px)}
  .txt{position:absolute;left:0;right:0;top:170px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .logo{width:300px;margin-bottom:30px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
  .kicker{display:inline-flex;align-items:center;gap:12px;padding:10px 24px 10px 18px;border-radius:999px;
    border:2px solid rgba(61,255,138,.6);background:rgba(4,30,20,.45);color:#7dffb4;font-weight:800;font-size:24px;letter-spacing:.18em}
  .kicker .dot{width:14px;height:14px;border-radius:50%;background:#3dff8a;box-shadow:0 0 0 5px rgba(61,255,138,.25),0 0 14px 2px rgba(61,255,138,.8)}
  .falta{margin:34px 0 20px;font-weight:800;font-size:64px;letter-spacing:.05em;color:#fff;line-height:1}
  .row{display:flex;align-items:center;gap:18px;justify-content:center}
  .tile{position:relative;height:160px;padding:0 30px;border-radius:26px;
    background:linear-gradient(180deg,#0f4d33 0%,#0b3a27 49.6%,#06261a 50.4%,#0a3423 100%);
    box-shadow:0 0 0 3px rgba(61,255,138,.55),0 0 40px 8px rgba(61,255,138,.35),0 24px 40px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.12);
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:112px;line-height:1;letter-spacing:-.03em}
  .tile span{background:linear-gradient(180deg,#ffe7a6 0%,#f4c55e 45%,#d89a2c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;transform:translateY(-4px)}
  .tile::after{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:#041a11}
  .as{font-weight:900;font-size:76px;color:#fff;letter-spacing:-.01em}
  .row+.row{margin-top:22px}
  /* Leila */
  .leila{position:absolute;left:0;bottom:0;height:1180px;
    -webkit-mask-image:linear-gradient(90deg,#000 0,#000 70%,transparent 98%),linear-gradient(0deg,#000 0,#000 85%,transparent 100%);-webkit-mask-composite:source-in}
  .glow{position:absolute;left:860px;top:1180px;width:700px;height:700px;margin:-350px 0 0 -350px;border-radius:50%;background:radial-gradient(circle,rgba(255,150,70,.35),rgba(255,150,70,0) 60%)}
  .iphone{position:absolute;right:20px;top:930px;height:470px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))}
  .swoosh{position:absolute;bottom:-1px;left:0;width:1080px;height:300px}
  .baixo{position:absolute;left:0;right:0;top:1440px;display:flex;flex-direction:column;align-items:flex-end;padding-right:40px}
  .nome{font-weight:600;font-size:38px;color:#eef6f0;text-shadow:0 4px 16px rgba(0,0,0,.6);margin-bottom:16px}
  .nome b{font-weight:800;background:linear-gradient(180deg,#ffe7a6,#f4c55e 45%,#d89a2c);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lance{display:inline-flex;align-items:center;gap:18px;padding:18px 34px 18px 28px;border-radius:26px;
    background:linear-gradient(180deg,#4dff95,#16c964);color:#04210f;
    box-shadow:0 0 0 4px rgba(61,255,138,.22),0 0 34px 8px rgba(61,255,138,.45),0 14px 30px rgba(0,0,0,.45)}
  .lance .l1{font-weight:800;font-size:28px;letter-spacing:.08em;line-height:1.1;text-align:left}
  .lance .l1 small{display:block;font-weight:700;font-size:24px;letter-spacing:.02em;opacity:.85}
  .lance .v{font-weight:900;font-size:88px;letter-spacing:-.02em;line-height:1}
</style></head>
<body><div class="stage">
  <div class="slats"></div>
  <div class="bokeh" style="left:80px;top:120px;width:90px;height:90px"></div>
  <div class="bokeh" style="left:900px;top:140px;width:60px;height:60px;opacity:.7"></div>
  <div class="bokeh" style="left:960px;top:760px;width:100px;height:100px;opacity:.5"></div>
  <div class="glow"></div>
  <img class="leila" src="leila-sabado.png">
  <img class="iphone" src="iphone.png">
  <svg class="swoosh" viewBox="0 0 1080 300" preserveAspectRatio="none">
    <defs><linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#b8862b"/><stop offset=".5" stop-color="#ffe3a0"/><stop offset="1" stop-color="#c8952f"/></linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14613f"/><stop offset="1" stop-color="#083a25"/></linearGradient></defs>
    <path d="M1080 80 C 880 190, 620 270, 300 302 L1080 302 Z" fill="url(#gr)"/>
    <path d="M1080 80 C 880 190, 620 270, 300 302" stroke="url(#gold)" stroke-width="5" fill="none"/>
  </svg>
  <div class="txt">
    <img class="logo" src="logo.png">
    <div class="kicker"><span class="dot"></span>LEILÃO ATIVO · LANCES ABERTOS</div>
    <div class="falta">O MARTELO BATE</div>
    <div class="row"><div class="tile"><span>SÁBADO</span></div></div>
    <div class="row"><div class="tile"><span>24/10</span></div><div class="as">ÀS</div><div class="tile"><span>18H</span></div></div>
  </div>
  <div class="baixo">
    <div class="nome">no leilão do <b>iPhone 17 Pro Max</b></div>
    <div class="lance"><div class="l1">LANCE ATUAL<small>está apenas</small></div><div class="v">R$ 297</div></div>
  </div>
</div></body></html>
