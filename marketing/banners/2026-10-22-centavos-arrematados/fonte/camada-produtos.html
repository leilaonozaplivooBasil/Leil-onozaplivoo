<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Camada dos produtos por cima do vídeo do banner (1920x1080, fundo transparente).
     window.quadro(t): os cards entram um a um e saem antes do fim, para o laço do vídeo emendar. -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:"Inter Display","Inter",sans-serif}
  .cards{position:absolute;left:782px;top:150px;display:flex;gap:34px}
  .card{width:330px;height:610px;border-radius:34px;background:#fff;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.45);display:flex;flex-direction:column;opacity:0}
  .foto{position:relative;height:250px;margin:18px 18px 0;border-radius:22px;background:#fff center/contain no-repeat}
  .off{position:absolute;right:-6px;top:-6px;padding:8px 16px;border-radius:999px;background:#e5243b;color:#fff;font-weight:900;font-size:34px;box-shadow:0 8px 16px rgba(0,0,0,.25)}
  .nome{font-weight:700;color:#0b2a1c;font-size:26px;line-height:1.2;height:62px;margin:16px 22px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mercado{margin:8px 20px 0;font-weight:600;font-size:20px;color:#5b6b63;white-space:nowrap}
  .mercado s{font-weight:900;font-size:24px;color:#0b2a1c;text-decoration:none}
  .preco{margin:12px 18px 0;padding:12px 0 14px;border-radius:22px;background:linear-gradient(180deg,#0b4d31,#06341f);text-align:center}
  .eco{margin:10px 18px 16px;padding:8px 0;border-radius:14px;background:#3dff8a;color:#03200f;text-align:center;font-weight:900;font-size:26px}
  .preco span{display:block;font-weight:800;font-size:22px;letter-spacing:.14em;color:#7dffb4}
  .preco b{display:block;font-weight:900;font-size:64px;line-height:1;margin-top:8px;white-space:nowrap;
    background:linear-gradient(180deg,#fff3c4 0%,#f4c55e 48%,#d89a2c 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
</style></head>
<body><div class="cards" id="cards"></div>
<script>
// Arremates escolhidos pelo dono (22/10/2026): valor final do banco; mercado do banco (relógio: R$ 197, informado pelo dono).
const ARREMATES = [
  { titulo: 'Estufa Para Salgados 5 Bandejas Expositor Elétrico Inox', valor: 28.47, mercado: 670.38, foto: 'estufa.jpg' },
  { titulo: 'RELÓGIO EYT', valor: 20.2, mercado: 197, foto: 'relogio.jpg' },
  { titulo: 'Bandeja Higiênica Gato Prime Arco-black', valor: 0.4, mercado: 32.41, foto: 'bandeja.webp' },
];
// quanto saiu mais barato que o valor de mercado, arredondado PARA BAIXO (nunca prometer mais do que foi)
const desconto = (a) => Math.floor((1 - a.valor / a.mercado) * 100);
const brl = (v) => v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
document.getElementById('cards').innerHTML = ARREMATES.map((a) => `
  <div class="card"><div class="foto" style="background-image:url(${a.foto})"><span class="off">-${desconto(a)}%</span></div>
  <div class="nome">${a.titulo}</div>
  <div class="mercado">Valor de mercado: <s>R$ ${brl(a.mercado)}</s></div>
  <div class="preco"><span>ARREMATADO POR</span><b>R$ ${brl(a.valor)}</b></div>
  <div class="eco">${desconto(a)}% mais barato</div></div>`).join('');
const cards = [...document.querySelectorAll('.card')];
const ENTRA = [1.4, 2.0, 2.6], SAI = 99;
const mola = (p) => 1 - Math.pow(1 - p, 3) + Math.sin(p * Math.PI) * 0.12; // entra com um quique leve
window.quadro = (t) => cards.forEach((c, i) => {
  const pe = Math.min(1, Math.max(0, (t - ENTRA[i]) / 0.45));
  const ps = Math.min(1, Math.max(0, (t - (SAI + i * 0.08)) / 0.35));
  const vis = pe * (1 - ps);
  c.style.opacity = Math.min(1, pe * 1.6) * (1 - ps);
  const esc = pe < 1 ? 0.6 + 0.4 * mola(pe) : 1 - 0.06 * ps;
  c.style.transform = `translateY(${(1 - pe) * 60 - ps * 30}px) scale(${esc})`;
  c.style.boxShadow = `0 30px 60px rgba(0,0,0,.45), 0 0 0 ${pe > 0 && pe < 1 ? 5 : 0}px #3dff8a, 0 0 ${pe > 0 && t - ENTRA[i] < 0.9 ? 60 : 0}px rgba(61,255,138,.6)`;
});
window.quadro(0);
</script></body></html>
