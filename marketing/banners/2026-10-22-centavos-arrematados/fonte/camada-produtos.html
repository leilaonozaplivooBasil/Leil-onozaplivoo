<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- 3 opções da área de produtos, na identidade do site (Modelo F): Barlow + Roboto Slab, preço de etiqueta
     verde-neon, selo laranja "NN% OFF" com a média de mercado riscada (CompareAQUI), base verde-noite.
     ?v=1|2|3  ?fundo=1 desenha o último quadro do vídeo atrás (prévia). -->
<link rel="stylesheet" href="fontes/fontes.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:Barlow,sans-serif}
  .fundo{position:absolute;inset:0;background:url(fundo-final.png) center/cover;display:none}
  .area{position:absolute;left:782px;top:150px;width:1058px;height:610px}
  .op{display:none;width:100%;height:100%}
  .slab{font-family:"Roboto Slab",serif}
  /* preço de etiqueta (PrecoDeEtiqueta do site): R$ pequeno, reais grandes, centavos no alto */
  .etq{display:flex;align-items:flex-start;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
  .etq .rs{font-weight:700;margin-right:6px}
  .etq .re{font-weight:800;letter-spacing:-.01em}
  .etq .ce{font-weight:700;margin-left:3px}
  .off{display:inline-block;border-radius:8px;background:#F35B12;color:#0A1410;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
  .riscado{color:#d1d5db;text-decoration:line-through;text-decoration-color:#9ca3af;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}

  /* ===== 1 — a vitrine do site (grade sem cartão) ===== */
  #o1{display:none;border-radius:26px;overflow:hidden;background:#0A1410;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 40px 80px rgba(0,0,0,.5);grid-template-columns:repeat(3,1fr)}
  #o1 .col{position:relative;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.08)}
  #o1 .col:last-child{border-right:0}
  #o1 .foto{position:relative;height:262px;background:#fff center/contain no-repeat;border-bottom:2px solid rgba(63,208,126,.35)}
  #o1 .faixa{position:absolute;left:0;right:0;bottom:0;padding:9px 0 8px;text-align:center;font-family:"Roboto Slab",serif;font-weight:800;font-size:25px;letter-spacing:.12em;color:#0A1410;background:linear-gradient(180deg,#F8D57A,#F5C451 55%,#D9A53A);box-shadow:0 -6px 16px rgba(0,0,0,.18)}
  #o1 .corpo{position:relative;flex:1;padding:16px 22px 22px;display:flex;flex-direction:column;
    background:linear-gradient(180deg,rgba(63,208,126,.11),rgba(63,208,126,.035) 40px,transparent 70px)}
  #o1 .tit{font-weight:500;font-size:24px;line-height:30px;color:#f3f4f6;height:60px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #o1 .lider{margin-top:6px;font-weight:800;font-size:21px;letter-spacing:.08em;color:#F5C451}
  #o1 .etq{margin-top:8px;color:#3FD07E}
  #o1 .etq .rs,#o1 .etq .ce{font-size:28px;margin-top:8px}
  #o1 .etq .re{font-size:84px}
  #o1 .rot{margin-top:6px;font-size:19px;font-weight:600;color:#cbd5d1}
  #o1 .cmp{margin-top:auto;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:rgba(12,32,56,.9);border:1px solid rgba(59,130,246,.35)}
  #o1 .cmp img{width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
  #o1 .cmp b{display:block;font-weight:800;font-size:21px;color:#93c5fd;line-height:1.1}
  #o1 .cmp span.l{display:flex;gap:10px;align-items:center;margin-top:5px}
  #o1 .off{font-size:20px;padding:2px 8px}
  #o1 .riscado{font-size:21px}

  /* ===== 2 — etiqueta OFF (cartão branco, estilo Mercado Livre) ===== */
  #o2{display:none;gap:34px}
  #o2 .c{flex:1;border-radius:24px;background:#fff;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 60px rgba(0,0,0,.45)}
  #o2 .foto{position:relative;height:300px;background:#fff center/contain no-repeat;margin:14px 14px 0}
  #o2 .foto .off{position:absolute;left:0;top:0;font-size:30px;padding:6px 14px;border-radius:10px}
  #o2 .corpo{flex:1;padding:14px 24px 22px;display:flex;flex-direction:column;border-top:1px solid #DDE4DF;margin-top:12px}
  #o2 .tit{font-weight:700;font-size:23px;line-height:29px;color:#0D1310;height:58px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #o2 .de{margin-top:auto;font-size:22px;color:#5C6B62;white-space:nowrap}
  #o2 .de s{font-weight:600;text-decoration-color:#5C6B62}
  #o2 .etq{margin-top:2px;color:#1B7A48}
  #o2 .etq .rs,#o2 .etq .ce{font-size:30px;margin-top:9px}
  #o2 .etq .re{font-size:92px}
  #o2 .arr{margin-top:6px;font-weight:700;font-size:19px;letter-spacing:.06em;color:#A9781C}

  /* ===== 3 — lista "de → saiu por" (painel de vidro escuro) ===== */
  #o3{display:none;flex-direction:column;border-radius:30px;background:rgba(10,20,16,.82);backdrop-filter:blur(8px);box-shadow:0 0 0 1px rgba(63,208,126,.3),0 40px 80px rgba(0,0,0,.5);padding:8px 30px}
  #o3 .r{flex:1;display:flex;align-items:center;gap:26px;border-bottom:1px solid rgba(255,255,255,.08)}
  #o3 .r:last-child{border-bottom:0}
  #o3 .foto{width:160px;height:160px;border-radius:18px;background:#fff center/contain no-repeat;flex:none}
  #o3 .meio{flex:1;min-width:0}
  #o3 .tit{font-weight:700;font-size:26px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #o3 .linha{display:flex;align-items:center;gap:26px;margin-top:10px}
  #o3 .de{font-size:22px;color:#9ca3af}
  #o3 .de .riscado{font-size:26px;color:#d1d5db}
  #o3 .por{font-size:20px;color:#F5C451;font-weight:700;letter-spacing:.04em}
  #o3 .etq{color:#3FD07E}
  #o3 .etq .rs,#o3 .etq .ce{font-size:24px;margin-top:6px}
  #o3 .etq .re{font-size:72px}
  #o3 .off{font-size:40px;padding:10px 18px;border-radius:14px;flex:none}
</style></head>
<body>
<div class="fundo" id="fundo"></div>
<div class="area">
  <div class="op" id="o1"></div>
  <div class="op" id="o2"></div>
  <div class="op" id="o3"></div>
</div>
<script>
// Arremates escolhidos pelo dono (22/10/2026). Valor final do banco; mercado do banco (relógio: R$ 197, do dono).
const ARREMATES = [
  { titulo: 'Estufa Para Salgados 5 Bandejas Expositor Elétrico Inox', valor: 28.47, mercado: 670.38, foto: 'estufa.jpg', quando: '21/10' },
  { titulo: 'RELÓGIO EYT', valor: 20.2, mercado: 197, foto: 'relogio.jpg', quando: '21/10' },
  { titulo: 'Bandeja Higiênica Gato Prime Arco-black', valor: 0.4, mercado: 32.41, foto: 'bandeja.webp', quando: '21/10' },
];
// a mesma conta do selo do site (src/lib/percentualAbaixo.js): arredonda e nunca passa de 99%
const pct = (a) => Math.min(99, Math.round(((a.mercado - a.valor) / a.mercado) * 100));
const media = (n) => Math.round(n).toLocaleString('pt-BR');           // média em reais inteiros, como no card
const etq = (v) => { const [r, c] = v.toFixed(2).split('.'); return `<p class="etq"><span class="rs">R$</span><span class="re">${Number(r).toLocaleString('pt-BR')}</span><span class="ce">${c}</span></p>`; };
const q = new URLSearchParams(location.search);
const v = q.get('v') || '1';
if (q.get('fundo')) document.getElementById('fundo').style.display = 'block';

document.getElementById('o1').innerHTML = ARREMATES.map((a) => `
  <div class="col"><div class="foto" style="background-image:url(${a.foto})"><span class="faixa">✓ ARREMATADO</span></div><div class="corpo">
    <p class="tit">${a.titulo}</p><p class="lider">ARREMATADO POR</p>${etq(a.valor)}<p class="rot">Leilão encerrado em ${a.quando}</p>
    <div class="cmp"><img src="compareaqui-icon.webp" alt=""><div><b>CompareAQUI</b><span class="l"><span class="off">${pct(a)}% OFF</span><span class="riscado">R$ ${media(a.mercado)}</span></span></div></div>
  </div></div>`).join('');
document.getElementById('o2').innerHTML = ARREMATES.map((a) => `
  <div class="c"><div class="foto" style="background-image:url(${a.foto})"><span class="off">${pct(a)}% OFF</span></div><div class="corpo">
    <p class="tit slab">${a.titulo}</p><p class="de">Valor de mercado <s>R$ ${media(a.mercado)}</s></p>${etq(a.valor)}<p class="arr">ARREMATADO</p>
  </div></div>`).join('');
document.getElementById('o3').innerHTML = ARREMATES.map((a) => `
  <div class="r"><div class="foto" style="background-image:url(${a.foto})"></div><div class="meio">
    <p class="tit slab">${a.titulo}</p>
    <div class="linha"><p class="de">De <span class="riscado">R$ ${media(a.mercado)}</span></p><p class="por">SAIU POR</p>${etq(a.valor)}</div>
  </div><span class="off">-${pct(a)}%</span></div>`).join('');
document.getElementById('o' + v).style.display = v === '2' || v === '3' ? 'flex' : 'grid';

// animação do vídeo (opção 1): o painel aparece, cada produto entra e a faixa ARREMATADO "carimba" em seguida
const PAINEL = document.getElementById('o1');
const COLS = [...PAINEL.querySelectorAll('.col')];
const ENTRA = [1.4, 2.0, 2.6];
const sai = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
window.quadro = (t) => {
  const pp = sai((t - 1.1) / 0.4);
  PAINEL.style.opacity = pp; PAINEL.style.transform = `translateY(${(1 - pp) * 40}px)`;
  COLS.forEach((c, i) => {
    const pe = sai((t - ENTRA[i]) / 0.45);
    c.style.opacity = pe; c.style.transform = `translateY(${(1 - pe) * 50}px)`;
    const f = c.querySelector('.faixa'); const pf = Math.min(1, Math.max(0, (t - ENTRA[i] - 0.4) / 0.25));
    const quique = pf < 1 ? 1.35 - 0.35 * sai(pf) : 1;
    f.style.opacity = pf; f.style.transform = `scale(${quique})`;
  });
};
</script></body></html>
