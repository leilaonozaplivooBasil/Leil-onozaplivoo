<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Prévia do banner vivo "Arrematados no Leilão dos Centavos" — 3 versões (?v=A|B|C), 1920x1080.
     Produtos e valores reais (os 3 últimos arremates dos centavos em 22/10/2026). -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#00180d;font-family:"Inter Display","Inter",sans-serif;color:#fff}
  .b{position:relative;width:1920px;height:1080px;overflow:hidden;display:none}
  .ouro{background:linear-gradient(180deg,#fff3c4 0%,#f4c55e 48%,#d89a2c 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .neon{color:#3dff8a}
  .selo{display:inline-flex;align-items:center;gap:14px;padding:12px 28px;border-radius:999px;background:rgba(61,255,138,.12);
    box-shadow:inset 0 0 0 2px rgba(61,255,138,.75);color:#7dffb4;font-weight:800;font-size:30px;letter-spacing:.14em}
  .selo i{width:16px;height:16px;border-radius:50%;background:#3dff8a;box-shadow:0 0 14px #3dff8a}
  .foto{background:#fff center/contain no-repeat}
  .nome{font-weight:700;color:#0b2a1c;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* ===== A — leiloeiro + vitrine de 3 cards ===== */
  #A{background:radial-gradient(70% 90% at 25% 60%,#0a5a39 0%,#06402a 45%,#00180d 100%)}
  #A .esq{position:absolute;left:90px;top:96px;width:640px}
  #A .logo{width:250px;display:block;margin-bottom:46px}
  #A h1{font-weight:900;font-size:112px;line-height:.95;letter-spacing:-.03em;margin-top:28px}
  #A .sub{margin-top:26px;font-weight:600;font-size:40px;color:#d8efe2;line-height:1.25}
  #A .leiloeiro{position:absolute;left:450px;bottom:-40px;width:480px;height:590px;background:url(a-apresenta.webp) no-repeat 50% 100%/contain;filter:drop-shadow(0 26px 30px rgba(0,0,0,.5))}
  #A .cards{position:absolute;right:80px;top:150px;display:flex;gap:34px}
  #A .card{width:330px;border-radius:34px;background:#fff;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.45)}
  #A .card .foto{height:330px;margin:18px 18px 0;border-radius:22px}
  #A .card .nome{font-size:30px;line-height:1.2;height:72px;margin:20px 24px 0}
  #A .card .preco{margin:18px 18px 18px;padding:16px 0 18px;border-radius:22px;background:linear-gradient(180deg,#0b4d31,#06341f);text-align:center}
  #A .card .preco span{display:block;font-weight:800;font-size:22px;letter-spacing:.14em;color:#7dffb4}
  #A .card .preco b{display:block;font-weight:900;font-size:64px;line-height:1;margin-top:8px;white-space:nowrap}
  #A .cta{position:absolute;right:80px;bottom:70px;width:900px;text-align:center;padding:30px 0;border-radius:999px;background:#3dff8a;color:#03200f;font-weight:900;font-size:44px;box-shadow:0 0 50px rgba(61,255,138,.45)}

  /* ===== B — etiquetas grandes de preço, sem personagem ===== */
  #B{background:linear-gradient(160deg,#019049 0%,#016a37 55%,#00492a 100%)}
  #B .faixa{position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 40px,transparent 40px 80px)}
  #B .topo{position:absolute;left:0;right:0;top:64px;text-align:center}
  #B .topo .logo{position:absolute;left:80px;top:-6px;width:220px}
  #B .topo h1{font-weight:900;font-size:96px;letter-spacing:-.03em;line-height:1}
  #B .topo p{margin-top:16px;font-weight:700;font-size:40px;color:#ffe08a}
  #B .cards{position:absolute;left:110px;right:110px;top:270px;display:flex;justify-content:space-between}
  #B .card{position:relative;width:520px;height:620px;border-radius:40px;background:#fff;box-shadow:0 30px 60px rgba(0,0,0,.35)}
  #B .card .foto{position:absolute;left:30px;right:30px;top:30px;height:300px;border-radius:26px}
  #B .card .nome{position:absolute;left:36px;right:36px;top:352px;font-size:30px;line-height:1.2}
  #B .card .preco{position:absolute;left:30px;right:30px;bottom:30px;height:120px;border-radius:26px;background:#0b2a1c;display:flex;align-items:center;justify-content:center;gap:16px}
  #B .card .preco b{font-weight:900;font-size:92px;line-height:1}
  #B .carimbo{position:absolute;right:-22px;top:-22px;padding:12px 26px;border-radius:16px;background:#ffe08a;color:#3b2a05;font-weight:900;font-size:28px;letter-spacing:.08em;transform:rotate(6deg);box-shadow:0 10px 20px rgba(0,0,0,.3)}
  #B .rodape{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-weight:800;font-size:40px}
  #B .rodape span{display:inline-block;padding:20px 54px;border-radius:999px;background:#0b2a1c;box-shadow:inset 0 0 0 3px #ffe08a}

  /* ===== C — "ao vivo": o último arremate em destaque + os dois anteriores ===== */
  #C{background:radial-gradient(80% 100% at 70% 50%,#06402a 0%,#03261a 55%,#00120a 100%)}
  #C .esq{position:absolute;left:90px;top:90px;width:760px}
  #C .logo{width:230px;display:block}
  #C .ao{margin-top:54px}
  #C h1{margin-top:30px;font-weight:900;font-size:84px;line-height:1;letter-spacing:-.02em}
  #C .saiu{margin-top:44px;font-weight:700;font-size:44px;color:#d8efe2}
  #C .grande{font-weight:900;font-size:220px;line-height:.9;letter-spacing:-.04em;margin-top:6px}
  #C .grande small{font-size:100px;margin-right:12px}
  #C .qual{margin-top:16px;font-weight:600;font-size:38px;color:#d8efe2;max-width:720px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #C .hero{position:absolute;left:900px;top:110px;width:560px;height:860px;border-radius:44px;background:#fff;box-shadow:0 0 0 6px #3dff8a,0 0 70px rgba(61,255,138,.45),0 40px 70px rgba(0,0,0,.55)}
  #C .hero .foto{position:absolute;inset:40px 40px 150px;border-radius:30px}
  #C .hero .tag{position:absolute;left:40px;right:40px;bottom:40px;height:90px;border-radius:24px;background:#0b2a1c;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:40px;letter-spacing:.06em;color:#3dff8a}
  #C .lado{position:absolute;right:80px;top:110px;width:330px;display:flex;flex-direction:column;gap:40px}
  #C .mini{height:410px;border-radius:36px;background:#fff;position:relative;box-shadow:0 30px 50px rgba(0,0,0,.45)}
  #C .mini .foto{position:absolute;inset:24px 24px 130px;border-radius:22px}
  #C .mini .preco{position:absolute;left:24px;right:24px;bottom:24px;height:90px;border-radius:22px;background:#0b2a1c;display:flex;align-items:center;justify-content:center}
  #C .mini .preco b{font-weight:900;font-size:60px}
</style></head>
<body>
<!-- A -->
<div class="b" id="A">
  <div class="esq">
    <img class="logo" src="logo-escuro.png" alt="">
    <span class="selo"><i></i>ARREMATADOS AGORA</span>
    <h1>Leilão dos <span class="ouro">Centavos</span></h1>
    <p class="sub">Olha por quanto <span class="neon">saíram</span>:</p>
  </div>
  <div class="leiloeiro"></div>
  <div class="cta">Dê seu lance a partir de centavos →</div>
</div>

<!-- B -->
<div class="b" id="B">
  <div class="faixa"></div>
  <div class="topo">
    <img class="logo" src="logo-escuro.png" alt="">
    <h1>Saiu por <span class="ouro">centavos!</span></h1>
    <p>Últimos arrematados no Leilão dos Centavos</p>
  </div>
  <div class="cards" data-lista></div>
  <div class="rodape"><span>Toque e participe do próximo →</span></div>
</div>

<!-- C -->
<div class="b" id="C">
  <div class="esq">
    <img class="logo" src="logo-escuro.png" alt="">
    <div class="ao"><span class="selo"><i></i>AO VIVO · LEILÃO DOS CENTAVOS</span></div>
    <h1>Acabou de ser <span class="ouro">arrematado</span></h1>
    <p class="saiu">Saiu por</p>
    <div class="grande ouro" id="grande"></div>
    <p class="qual" id="qual"></p>
  </div>
  <div class="hero"><div class="foto" id="heroFoto"></div><div class="tag">ARREMATADO ✓</div></div>
  <div class="lado" data-mini></div>
</div>

<script>
// Os 3 últimos arremates do Leilão dos Centavos (do banco, 22/10/2026), do mais novo para o mais antigo.
const ARREMATES = [
  { titulo: 'RELÓGIO EYT', valor: 20.2, foto: 'relogio.jpg' },
  { titulo: 'Kit 2 Unidades Fone De Ouvido C/ Entrada P2 C/ Microfone Preto', valor: 0.75, foto: 'fone.webp' },
  { titulo: 'Bandeja Higiênica Gato Prime Arco-black', valor: 0.4, foto: 'bandeja.webp' },
];
const brl = (v) => v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const v = new URLSearchParams(location.search).get('v') || 'A';
document.getElementById(v).style.display = 'block';

if (v === 'A') document.querySelector('#A [data-lista]').innerHTML = ARREMATES.map((a) => `
  <div class="card"><div class="foto" style="background-image:url(${a.foto})"></div>
    <div class="nome">${a.titulo}</div>
    <div class="preco"><span>ARREMATADO POR</span><b class="ouro">R$ ${brl(a.valor)}</b></div></div>`).join('');
if (v === 'B') document.querySelector('#B [data-lista]').innerHTML = ARREMATES.map((a) => `
  <div class="card"><span class="carimbo">ARREMATADO</span><div class="foto" style="background-image:url(${a.foto})"></div>
    <div class="nome">${a.titulo}</div>
    <div class="preco"><b class="ouro">R$ ${brl(a.valor)}</b></div></div>`).join('');
if (v === 'C') {
  const [u, ...resto] = ARREMATES;
  document.getElementById('grande').innerHTML = `<small>R$</small>${brl(u.valor)}`;
  document.getElementById('qual').textContent = u.titulo;
  document.getElementById('heroFoto').style.backgroundImage = `url(${u.foto})`;
  document.querySelector('#C [data-mini]').innerHTML = resto.map((a) => `
    <div class="mini"><div class="foto" style="background-image:url(${a.foto})"></div><div class="preco"><b class="ouro">R$ ${brl(a.valor)}</b></div></div>`).join('');
}
</script></body></html>
