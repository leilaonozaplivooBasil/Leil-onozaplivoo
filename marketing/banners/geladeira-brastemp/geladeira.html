<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head><body>
<!-- Geladeira duplex inox (provisória até chegar a foto real do leilão) -->
<svg id="s" width="760" height="1500" viewBox="0 0 760 1500" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="inox" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8e949b"/><stop offset=".08" stop-color="#d9dde1"/><stop offset=".22" stop-color="#eef0f2"/>
    <stop offset=".45" stop-color="#c9cdd2"/><stop offset=".62" stop-color="#e6e9ec"/><stop offset=".85" stop-color="#bcc1c6"/><stop offset="1" stop-color="#7d838a"/>
  </linearGradient>
  <linearGradient id="brush" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".12"/>
  </linearGradient>
  <linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6c7178"/><stop offset="1" stop-color="#9aa0a6"/></linearGradient>
  <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6f757c"/><stop offset=".4" stop-color="#f4f6f8"/><stop offset="1" stop-color="#868c93"/></linearGradient>
  <pattern id="lines" width="760" height="3" patternUnits="userSpaceOnUse"><rect width="760" height="1" fill="#ffffff" opacity=".07"/></pattern>
  <filter id="sh" x="-20%" y="-10%" width="140%" height="130%"><feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#000" flood-opacity=".5"/></filter>
</defs>
<g filter="url(#sh)">
  <!-- lateral (profundidade) -->
  <path d="M640 20 L700 50 L700 1440 L640 1470 Z" fill="url(#side)"/>
  <!-- porta do freezer -->
  <rect x="20" y="20" width="620" height="420" rx="26" fill="url(#inox)"/>
  <rect x="20" y="20" width="620" height="420" rx="26" fill="url(#lines)"/>
  <rect x="20" y="20" width="620" height="420" rx="26" fill="url(#brush)"/>
  <!-- porta do refrigerador -->
  <rect x="20" y="452" width="620" height="1018" rx="26" fill="url(#inox)"/>
  <rect x="20" y="452" width="620" height="1018" rx="26" fill="url(#lines)"/>
  <rect x="20" y="452" width="620" height="1018" rx="26" fill="url(#brush)"/>
  <!-- vão entre portas -->
  <rect x="20" y="440" width="620" height="12" fill="#3b3f44"/>
  <!-- puxadores verticais -->
  <rect x="560" y="120" width="26" height="250" rx="13" fill="url(#handle)"/>
  <rect x="560" y="530" width="26" height="520" rx="13" fill="url(#handle)"/>
  <!-- painel eletrônico discreto -->
  <rect x="250" y="520" width="160" height="56" rx="10" fill="#1d2126" opacity=".85"/>
  <circle cx="285" cy="548" r="7" fill="#7dd3fc"/><circle cx="315" cy="548" r="7" fill="#7dd3fc" opacity=".5"/>
  <rect x="340" y="540" width="50" height="16" rx="4" fill="#7dd3fc" opacity=".7"/>
  <!-- reflexo -->
  <path d="M70 20 L190 20 L110 1470 L50 1470 Z" fill="#fff" opacity=".10"/>
  <!-- rodapé -->
  <rect x="30" y="1462" width="600" height="18" rx="6" fill="#2a2e33"/>
</g>
</svg></body></html>
