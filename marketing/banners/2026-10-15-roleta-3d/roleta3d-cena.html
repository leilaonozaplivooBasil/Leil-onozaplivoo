<!doctype html>
<!-- Cena 3D da roleta (three.js 0.160). Para renderizar de novo: servir esta pasta com three instalado em ./node_modules e abrir no Chromium. -->
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const W = 1500, H = 1650;
const params = new URLSearchParams(location.search);
const BLUR = Number(params.get('blur') ?? 1);     // 1 = rastro de giro leve
const YAW = Number(params.get('yaw') ?? -26);      // vira a roda para o leiloeiro

// ---------- textura dos gomos (valores REAIS da roleta do site: src/lib/roletaLeilao20.js) ----------
const T = 'TENTE';
const SEG = [1, 5, 2, 20, T, 10, 3, 50, 1, 5, T, 2].map((v, i) => ({ v, cor: v === T ? 'vermelho' : i % 2 === 0 ? 'azul' : 'ouro' }));
const S = 2048, c = S / 2, R = c * 0.985;
function desenharGomos(ctx) {
  const n = SEG.length, passo = (Math.PI * 2) / n;
  SEG.forEach((s, i) => {
    const a0 = -Math.PI / 2 + i * passo, a1 = a0 + passo;
    const gx = c + Math.cos(a0 + passo / 2) * R, gy = c + Math.sin(a0 + passo / 2) * R;
    const grad = ctx.createLinearGradient(c, c, gx, gy);
    if (s.cor === 'azul') { grad.addColorStop(0, '#1b47b8'); grad.addColorStop(1, '#5b97ff'); }
    else if (s.cor === 'ouro') { grad.addColorStop(0, '#e0a21f'); grad.addColorStop(1, '#ffe39a'); }
    else { grad.addColorStop(0, '#8f1d24'); grad.addColorStop(1, '#ec545a'); }
    ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, R, a0, a1); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();
    ctx.lineWidth = 14; ctx.strokeStyle = '#f7d777'; ctx.stroke();
  });
  // valores, lidos do miolo para a borda (como no site)
  SEG.forEach((s, i) => {
    const meio = -Math.PI / 2 + (i + 0.5) * passo;
    ctx.save(); ctx.translate(c, c); ctx.rotate(meio);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    const fam = '"Inter Display","Inter",sans-serif';
    if (s.v === T) {
      ctx.font = `900 76px ${fam}`; ctx.lineWidth = 8; ctx.strokeStyle = '#5a0f15';
      ctx.strokeText('TENTE DE NOVO', R - 75, 0); ctx.fillStyle = '#fff'; ctx.fillText('TENTE DE NOVO', R - 75, 0);
    } else {
      const azul = s.cor === 'azul';
      ctx.font = `900 190px ${fam}`;
      const num = String(s.v); const wNum = ctx.measureText(num).width;
      ctx.lineWidth = 8; ctx.strokeStyle = azul ? '#0e2a73' : '#fff3b0';
      ctx.strokeText(num, R - 100, 6); ctx.fillStyle = azul ? '#ffffff' : '#3b2503'; ctx.fillText(num, R - 100, 6);
      ctx.font = `800 86px ${fam}`; ctx.fillStyle = azul ? '#cfe0ff' : '#6a4308';
      ctx.fillText('R$', R - 120 - wNum, 10);
    }
    ctx.restore();
  });
  // pinos dourados na divisa dos gomos
  for (let i = 0; i < SEG.length; i++) {
    const a = -Math.PI / 2 + i * passo;
    ctx.beginPath(); ctx.arc(c + Math.cos(a) * (R - 26), c + Math.sin(a) * (R - 26), 22, 0, Math.PI * 2);
    ctx.fillStyle = '#fff3c4'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = '#b98419'; ctx.stroke();
  }
}
const base = document.createElement('canvas'); base.width = base.height = S;
desenharGomos(base.getContext('2d'));
// rastro de giro: cópias levemente giradas e transparentes (o número continua legível)
const tex = document.createElement('canvas'); tex.width = tex.height = S;
const tc = tex.getContext('2d');
tc.drawImage(base, 0, 0);
if (BLUR > 0) {
  for (let k = 1; k <= 14; k++) {
    tc.save(); tc.globalAlpha = 0.045 * BLUR * (1 - k / 16); tc.translate(c, c); tc.rotate(-k * 0.012); tc.translate(-c, -c); tc.drawImage(base, 0, 0); tc.restore();
  }
}
tc.globalAlpha = 1;
// recorta em círculo
tc.globalCompositeOperation = 'destination-in'; tc.beginPath(); tc.arc(c, c, R, 0, Math.PI * 2); tc.fill();

// ---------- cena ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.25;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.02).texture;

const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
camera.position.set(0, 0.6, 20.5); camera.lookAt(0, -0.6, 0);

const ouro = new THREE.MeshStandardMaterial({ color: 0xffcf4a, metalness: 0.75, roughness: 0.22 });
const ouroEscuro = new THREE.MeshStandardMaterial({ color: 0xd69a2a, metalness: 0.8, roughness: 0.3 });
const azulPe = new THREE.MeshStandardMaterial({ color: 0x1a3c96, metalness: 0.35, roughness: 0.35 });

const roda = new THREE.Group(); scene.add(roda);
const RW = 3.0;
// face com os gomos
const tx = new THREE.CanvasTexture(tex); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8;
const face = new THREE.Mesh(new THREE.CircleGeometry(RW, 128), new THREE.MeshBasicMaterial({ map: tx, toneMapped: false }));
face.position.z = 0.23; roda.add(face);
// corpo (disco grosso) atrás da face
const corpo = new THREE.Mesh(new THREE.CylinderGeometry(RW + 0.05, RW + 0.05, 0.36, 128), ouroEscuro);
corpo.rotation.x = Math.PI / 2; roda.add(corpo);
// aro dourado largo (anel extrudado) + bordas arredondadas
const aroShape = new THREE.Shape(); aroShape.absarc(0, 0, RW + 0.62, 0, Math.PI * 2, false);
const furo = new THREE.Path(); furo.absarc(0, 0, RW - 0.02, 0, Math.PI * 2, true); aroShape.holes.push(furo);
const aro = new THREE.Mesh(new THREE.ExtrudeGeometry(aroShape, { depth: 0.5, bevelEnabled: true, bevelThickness: 0.14, bevelSize: 0.12, bevelSegments: 6, curveSegments: 128 }), ouro);
aro.position.z = -0.12; roda.add(aro);
const frisoI = new THREE.Mesh(new THREE.TorusGeometry(RW + 0.02, 0.07, 16, 160), ouroEscuro); frisoI.position.z = 0.42; roda.add(frisoI);
// lâmpadas
for (let k = 0; k < 24; k++) {
  const a = (k / 24) * Math.PI * 2, rr = RW + 0.31;
  const acesa = k % 2 === 0;
  const l = new THREE.Mesh(new THREE.SphereGeometry(0.135, 24, 16), new THREE.MeshStandardMaterial({
    color: 0xfff7d6, emissive: acesa ? 0xfff0b0 : 0xffc24a, emissiveIntensity: acesa ? 1.6 : 0.6, roughness: 0.2, toneMapped: false }));
  l.position.set(Math.cos(a) * rr, Math.sin(a) * rr, 0.6); roda.add(l);
  const soq = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.035, 10, 32), ouroEscuro);
  soq.position.copy(l.position); soq.position.z = 0.55; roda.add(soq);
}
// miolo com $
const miolo = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.7, 0.42, 96), ouro);
miolo.rotation.x = Math.PI / 2; miolo.position.z = 0.36; roda.add(miolo);
const domo = new THREE.Mesh(new THREE.SphereGeometry(0.6, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2), ouro);
domo.rotation.x = Math.PI / 2; domo.scale.set(1, 0.38, 1); domo.position.z = 0.56; roda.add(domo);
const cifrao = document.createElement('canvas'); cifrao.width = cifrao.height = 512;
{ const g = cifrao.getContext('2d'); g.font = '900 360px "Inter Display","Inter",sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#5a3a06'; g.fillText('$', 256, 276); }
const ctx2 = new THREE.CanvasTexture(cifrao); ctx2.colorSpace = THREE.SRGBColorSpace;
const cif = new THREE.Mesh(new THREE.PlaneGeometry(0.85, 0.85), new THREE.MeshStandardMaterial({ map: ctx2, transparent: true, metalness: 0.6, roughness: 0.35 }));
cif.position.z = 0.8; roda.add(cif);

// ponteiro (fica parado, em cima)
const ponteiro = new THREE.Group(); scene.add(ponteiro);
const pShape = new THREE.Shape(); pShape.moveTo(-0.55, 0.45); pShape.lineTo(0.55, 0.45); pShape.lineTo(0, -0.62); pShape.closePath();
const pMesh = new THREE.Mesh(new THREE.ExtrudeGeometry(pShape, { depth: 0.3, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.08, bevelSegments: 4 }), ouro);
ponteiro.add(pMesh);
const gema = new THREE.Mesh(new THREE.SphereGeometry(0.17, 32, 16), new THREE.MeshStandardMaterial({ color: 0xd8161e, emissive: 0x5a0000, metalness: 0.2, roughness: 0.12 }));
gema.position.set(0, 0.15, 0.42); ponteiro.add(gema);
ponteiro.position.set(0, RW + 0.6, 0.55);

// pé azul + base dourada (como no site)
const pe = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 1.15, 2.2, 64), azulPe);
pe.position.set(0, -RW - 1.15, -0.35); scene.add(pe);
const base3 = new THREE.Mesh(new RoundedBoxGeometry(3.6, 0.38, 1.6, 6, 0.16), ouro);
base3.position.set(0, -RW - 2.35, -0.35); scene.add(base3);

// inclinação 3D da roda + ponteiro juntos
const tudo = [roda, ponteiro];
const pivo = new THREE.Group(); scene.add(pivo);
tudo.forEach((o) => { scene.remove(o); pivo.add(o); });
pivo.rotation.y = THREE.MathUtils.degToRad(YAW);
pivo.rotation.x = THREE.MathUtils.degToRad(-4);
roda.rotation.z = THREE.MathUtils.degToRad(Number(params.get('giro') ?? 9));

// luzes
const key = new THREE.DirectionalLight(0xfff1d0, 2.4); key.position.set(-6, 8, 10); scene.add(key);
const rim = new THREE.DirectionalLight(0x7dffb4, 0.9); rim.position.set(8, 2, -4); scene.add(rim);
const fill = new THREE.DirectionalLight(0x8fb4ff, 0.8); fill.position.set(4, -3, 8); scene.add(fill);
scene.add(new THREE.AmbientLight(0x6a6a7a, 0.9));
const frente = new THREE.PointLight(0xfff0d0, 120, 60); frente.position.set(-2, 3, 12); scene.add(frente);

renderer.render(scene, camera);
window.PRONTO = true;
</script></body></html>
