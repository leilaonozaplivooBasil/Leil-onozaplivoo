<!doctype html>
<html><head><meta charset="utf-8">
<!-- Banner 16:9 "Oportunidade que sai da tela" — iPhone 17 Pro Max. A cena (cena-vN.jpg) é foto gerada com a Leila e o
     iPhone oficiais como referência; os textos são HTML (fonte da marca), nada de texto gerado por IA.
     Parâmetros no endereço: ?v=1|2|3  &lado=esq|dir -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#04150e}
  .stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:"Inter Display","Inter",sans-serif;
    background-size:cover;background-position:center}
  .veu{position:absolute;inset:0}
  .esq .veu{background:linear-gradient(90deg,rgba(3,22,14,.82) 0%,rgba(3,22,14,.55) 32%,rgba(3,22,14,0) 52%)}
  .dir .veu{background:linear-gradient(270deg,rgba(3,22,14,.85) 0%,rgba(3,22,14,.6) 30%,rgba(3,22,14,0) 48%)}
  .txt{position:absolute;top:150px;width:780px}
  .esq .txt{left:120px}
  .dir .txt{right:60px;width:690px}
  .dir .linha,.col .linha{flex-direction:column;align-items:flex-start;gap:18px}
  .lance .v{white-space:nowrap}
  .logo{width:230px;display:block;margin-bottom:46px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
  .t1{font-weight:900;font-size:var(--t,84px);white-space:nowrap;line-height:.98;letter-spacing:-.025em;color:#fff;text-shadow:0 8px 34px rgba(0,0,0,.5)}
  .t1 .g{display:block;background:linear-gradient(180deg,#b6ffd3 0%,#3dff8a 45%,#12c964 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(61,255,138,.4))}
  .regua{width:120px;height:5px;border-radius:3px;margin:34px 0 26px;background:linear-gradient(90deg,#f4c55e,rgba(244,197,94,0))}
  .prod{font-weight:800;font-size:62px;letter-spacing:-.02em;line-height:1;
    background:linear-gradient(180deg,#fff3c4 0%,#f4c55e 50%,#d89a2c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px rgba(0,0,0,.4))}
  .linha{display:flex;align-items:center;gap:22px;margin-top:40px;flex-wrap:nowrap}
  .lance{display:inline-flex;align-items:center;gap:18px;padding:16px 30px 16px 26px;border-radius:22px;
    background:linear-gradient(180deg,rgba(15,77,51,.92),rgba(6,38,26,.92));
    box-shadow:0 0 0 3px rgba(61,255,138,.75),0 0 40px 8px rgba(61,255,138,.35),0 14px 30px rgba(0,0,0,.5)}
  .lance .l1{font-weight:800;font-size:22px;letter-spacing:.12em;color:#7dffb4;line-height:1.15}
  .lance .v{font-weight:900;font-size:68px;letter-spacing:-.02em;line-height:1;
    background:linear-gradient(180deg,#ffe7a6 0%,#f4c55e 45%,#d89a2c 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .data{display:inline-flex;align-items:center;gap:14px;padding:18px 28px;border-radius:999px;
    border:2px solid rgba(255,255,255,.35);background:rgba(3,22,14,.55);backdrop-filter:blur(6px);
    color:#fff;font-weight:800;font-size:34px;letter-spacing:.02em;white-space:nowrap}
  .data svg{width:34px;height:34px}
  .data .dot{color:#3dff8a;margin:0 2px}
  /* cartõezinhos de interface só com ícone (cobrem os cartões com texto inventado da cena 1) */
  .chip{position:absolute;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:18px;
    background:linear-gradient(180deg,rgba(28,92,62,.95),rgba(10,52,34,.95));
    box-shadow:0 0 0 1.5px rgba(125,255,180,.45),0 10px 24px rgba(0,0,0,.45)}
  .chip .ic{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#f4c55e 50%,#b57b16);display:flex;align-items:center;justify-content:center}
  .chip .ic svg{width:30px;height:30px}
  .chip .bar{height:12px;border-radius:6px;background:rgba(255,255,255,.55)}
  .chip .bar.s{background:rgba(125,255,180,.8)}
  .falta{display:flex;align-items:center;gap:18px}
  .fw{font-weight:900;font-size:68px;letter-spacing:-.02em;color:#fff;text-shadow:0 8px 30px rgba(0,0,0,.5)}
  .tile3{position:relative;width:146px;height:166px;border-radius:26px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#0f4d33 0%,#0b3a27 49.6%,#06261a 50.4%,#0a3423 100%);
    box-shadow:0 0 0 3px rgba(61,255,138,.6),0 0 44px 10px rgba(61,255,138,.38),0 24px 40px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.12);
    font-weight:900;font-size:128px;line-height:1}
  .tile3 span{background:linear-gradient(180deg,#ffe7a6 0%,#f4c55e 45%,#d89a2c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;transform:translateY(-4px)}
  .tile3::after{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:#041a11}
  .para{margin-top:36px;font-weight:600;font-size:44px;color:#eef6f0;text-shadow:0 4px 16px rgba(0,0,0,.5)}
  .prod{font-size:76px!important;margin-top:6px}
  .regua{margin:30px 0 28px!important}
  .data{font-size:40px!important;padding:20px 34px!important}
  .data svg{width:40px!important;height:40px!important}
</style></head>
<body><div class="stage" id="st">
  <div class="veu"></div>
  <div id="chips"></div>
  <div class="txt">
    <img class="logo" src="logo.png">
    <div class="falta"><span class="fw" id="ff">FALTAM</span><div class="tile3"><span id="fn">3</span></div><span class="fw" id="fu">DIAS</span></div>
    <div class="para">para o leilão do nosso</div>
    <div class="prod">iPhone 17 Pro Max</div>
    <div class="regua"></div>
    <div class="data"><svg viewBox="0 0 24 24" fill="none" stroke="#3dff8a" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>24/10 <span class="dot">•</span> ÀS 18H</div>
  </div>
</div>
<script>
const q=new URLSearchParams(location.search); const v=q.get('v')||'1';
const st=document.getElementById('st'); st.classList.add(q.get('lado')||'esq'); if(q.get('n')){document.getElementById('fn').textContent=q.get('n');document.getElementById('ff').textContent=q.get('falta');document.getElementById('fu').textContent=q.get('unit');} if(q.get('col')) st.classList.add('col'); if(q.get('t')) st.style.setProperty('--t',q.get('t')+'px'); if(q.get('x')) document.querySelector('.txt').style.left=q.get('x')+'px';
st.style.backgroundImage=`url(cena-v${v}${v==='1'?'-limpa':''}.jpg)`;
const martelo='<svg viewBox="0 0 24 24" fill="none" stroke="#5a3a06" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6M12 6l6 6M4 20l8-8M11 7l6 6-3 3-6-6z"/></svg>';
const seta='<svg viewBox="0 0 24 24" fill="none" stroke="#5a3a06" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';
const chip=(x,y,w,h,ic)=>`<div class="chip" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><div class="ic">${ic}</div><div style="display:flex;flex-direction:column;gap:9px"><div class="bar s" style="width:${w*.36}px"></div><div class="bar" style="width:${w*.5}px"></div></div></div>`;
if(v==='1') document.getElementById('chips').innerHTML = chip(1572,222,230,92,martelo)+chip(1086,732,230,92,seta);
</script></body></html>
