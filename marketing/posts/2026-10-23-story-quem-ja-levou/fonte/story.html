<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Story "Quem já levou, e por quanto" — 1080x1920. Print da tela do site no centro, fundo Verde (Vivo) da marca.
     A faixa de baixo (1520–1760) fica livre para a figurinha de link do Instagram. -->
<link rel="stylesheet" href="fontes/fontes.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:Barlow,sans-serif;color:#fff}
  .s{position:relative;width:1080px;height:1920px;overflow:hidden;background:linear-gradient(165deg,#019049 0%,#017a3f 48%,#016A37 100%)}
  .raios{position:absolute;left:50%;top:960px;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;opacity:.07;
    background:repeating-conic-gradient(from 0deg,#fff 0 4deg,transparent 4deg 16deg);
    -webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%)}
  .luz{position:absolute;left:50%;top:960px;width:1100px;height:900px;margin:-450px 0 0 -550px;background:radial-gradient(closest-side,rgba(255,224,138,.35),transparent)}
  .logo{position:absolute;top:150px;left:50%;width:270px;margin-left:-135px}
  .selo{position:absolute;top:300px;left:0;right:0;text-align:center}
  .selo span{display:inline-flex;align-items:center;gap:14px;padding:12px 30px;border-radius:999px;background:rgba(0,0,0,.2);box-shadow:inset 0 0 0 2px #FFE08A;color:#FFE08A;font-weight:800;font-size:30px;letter-spacing:.16em}
  .selo i{width:14px;height:14px;border-radius:50%;background:#FFE08A;box-shadow:0 0 12px #FFE08A}
  h1{position:absolute;top:380px;left:50px;right:50px;text-align:center;font-family:"Roboto Slab",serif;font-weight:800;font-size:74px;line-height:1.08;letter-spacing:-.02em;text-shadow:0 6px 24px rgba(0,0,0,.25)}
  h1 em{font-style:normal;color:#FFE08A}
  .tela{position:absolute;left:70px;right:70px;top:600px;border-radius:44px;padding:14px;background:linear-gradient(160deg,#FFF0B8,#E8BE55);
    box-shadow:0 40px 80px rgba(0,0,0,.45),0 0 0 2px rgba(255,255,255,.2);transform:rotate(-1.5deg)}
  .tela img{display:block;width:100%;border-radius:32px}
  .cta{position:absolute;top:1530px;left:0;right:0;text-align:center;font-weight:800;font-size:44px;line-height:1.2}
  .cta b{color:#FFE08A}
  .seta{position:absolute;top:1660px;left:50%;margin-left:-28px;width:56px;height:56px;border-right:8px solid #FFE08A;border-bottom:8px solid #FFE08A;transform:rotate(45deg);border-radius:4px}
</style></head>
<body><div class="s">
  <div class="raios"></div><div class="luz"></div>
  <img class="logo" src="logo-escuro.png" alt="">
  <div class="selo"><span><i></i>PROVA REAL</span></div>
  <h1>Gente de verdade,<br><em>arrematando de verdade</em></h1>
  <div class="tela"><img src="print.jpg" alt=""></div>
  <p class="cta">Veja os vídeos de quem arrematou<br><b>toque no link</b></p>
  <div class="seta"></div>
</div></body></html>
