<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Post estático "Por quanto vai sair?" — iPhone 17 Pro Max, sábado 24/10 12h. 1080x1350. ?lance=800 mostra o lance da hora. -->
<link rel="stylesheet" href="fontes/fontes.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden;font-family:Barlow,sans-serif;color:#fff}
  .s{position:relative;width:1080px;height:1350px;overflow:hidden;background:linear-gradient(160deg,#019049 0%,#017a3f 50%,#016A37 100%)}
  .s::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 48%,rgba(255,224,138,.22),transparent 70%)}
  .logo{position:absolute;top:56px;left:50%;width:240px;margin-left:-120px}
  .selo{position:absolute;top:200px;left:0;right:0;text-align:center}
  .selo span{display:inline-flex;align-items:center;gap:14px;padding:12px 30px;border-radius:999px;background:rgba(0,0,0,.2);box-shadow:inset 0 0 0 2px #FFE08A;color:#FFE08A;font-weight:800;font-size:30px;letter-spacing:.14em}
  .selo i{width:14px;height:14px;border-radius:50%;background:#FFE08A;box-shadow:0 0 12px #FFE08A}
  h1{position:absolute;top:278px;left:40px;right:40px;text-align:center;font-family:"Roboto Slab",serif;font-weight:800;font-size:112px;line-height:1;letter-spacing:-.03em;text-shadow:0 6px 24px rgba(0,0,0,.25)}
  h1 em{font-style:normal;color:#FFE08A}
  .foto{position:absolute;left:50%;top:430px;width:440px;height:520px;margin-left:-220px;border-radius:40px;background:#fff url(iphone-1.png) center/86% no-repeat;box-shadow:0 0 0 6px #FFE08A,0 40px 80px rgba(0,0,0,.4);transform:rotate(-3deg)}
  .q{position:absolute;top:392px;left:705px;width:150px;height:150px;border-radius:50%;background:#FFE08A;color:#0A2A18;display:flex;align-items:center;justify-content:center;font-family:"Roboto Slab",serif;font-weight:900;font-size:110px;transform:rotate(12deg);box-shadow:0 14px 30px rgba(0,0,0,.3)}
  .nome{position:absolute;top:985px;left:0;right:0;text-align:center;font-weight:800;font-size:44px}
  .nome span{font-weight:600;color:rgba(255,255,255,.8)}
  .precos{position:absolute;top:1060px;left:60px;right:60px;display:flex;gap:20px}
  .bx{flex:1;border-radius:26px;padding:18px 8px 20px;text-align:center}
  .bx small{display:block;font-weight:800;font-size:22px;letter-spacing:.12em}
  .bx b{display:block;margin-top:6px;font-family:"Roboto Slab",serif;font-weight:800;font-size:56px;line-height:1.1;white-space:nowrap}
  .bx b span{font-size:28px;margin-right:6px}
  .loja{background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
  .loja small{color:rgba(255,255,255,.8)}
  .loja b i{font-style:normal;position:relative}
  .loja b i::after{content:"";position:absolute;left:-6px;right:-6px;top:52%;height:5px;border-radius:3px;background:#FFE08A;transform:rotate(-6deg)}
  .ini{background:#fff;color:#00180D;box-shadow:0 18px 36px rgba(0,0,0,.22)}
  .ini small{color:#016A37}
  .agora{background:#0A2A18;box-shadow:inset 0 0 0 3px #FFE08A}
  .agora small{color:#FFE08A}
  .rodape{position:absolute;left:0;right:0;bottom:56px;text-align:center;font-weight:800;font-size:36px}
  .rodape span{color:#FFE08A}
</style></head>
<body><div class="s">
  <img class="logo" src="logo-escuro.png" alt="">
  <div class="selo"><span><i></i>HOJE · O MARTELO BATE ÀS 18H</span></div>
  <h1>Por quanto <em>vai sair?</em></h1>
  <div class="foto"></div><div class="q">?</div>
  <p class="nome">iPhone 17 Pro Max <span>· 256 GB</span></p>
  <div class="precos" id="precos">
    <div class="bx loja"><small>NA LOJA</small><b><i><span>R$</span>8.404</i></b></div>
    <div class="bx ini"><small>COMEÇOU EM</small><b><span>R$</span>297</b></div>
  </div>
  <p class="rodape">Deixa seu palpite nos comentários <span>👇</span></p>
</div>
<script>
const lance = new URLSearchParams(location.search).get('lance');
if (lance) document.getElementById('precos').insertAdjacentHTML('beforeend', `<div class="bx agora"><small>LANCE AGORA</small><b><span>R$</span>${Number(lance).toLocaleString('pt-BR')}</b></div>`);
</script></body></html>
